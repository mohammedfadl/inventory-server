// ================= مبيعات العروض الترويجية =================
// Item list imported by item number; sales for a user-chosen period are read from "مبيعات الفروع حسب كل شهر"
// (DB.monthlySales). previous stock = current stock + sales in the period; sell-through % = sales ÷ previous stock.
// The near-expiry view is independent: its previous stock is the quantity uploaded on the near-expiry page.
const PROMO_COLORS  = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];   // validated categorical order
const PROMO_COLORS2 = ['#184f95','#a8431b','#0f7a55','#9a6a00','#b04a74','#005a00','#2f2573','#a82a29'];   // same hues, darker — only for the 9th+ branch
function promoState(){
  const s = ps('promo');
  if(s.view==null){ s.view='main'; s.pmode='last'; s.months=3; s.picked=[]; }
  return s;
}
let promoMonthsOpen = false;
function promoBranchColor(code){
  const codes = DB.branches.map(b=>String(b.code)).sort((a,b)=>collNum.compare(a,b));
  let i = codes.indexOf(String(code)); if(i<0) i = codes.length;
  return i<8 ? PROMO_COLORS[i] : PROMO_COLORS2[i%8];
}
function promoPeriodMonths(){
  const avail = monthlySalesMonths();
  const st = promoState();
  if(st.pmode==='pick'){
    const picked = (st.picked||[]).filter(m=>avail.includes(m)).sort();
    if(picked.length) return picked;
  }
  const n = Math.min(avail.length, Math.max(1, parseInt(st.months)||3));
  return avail.slice(-n);
}
function promoPeriodText(months){
  if(!months.length) return '—';
  const L = m=>'\u2066'+m+'\u2069';          // keep YYYY-MM left-to-right inside Arabic text
  if(months.length<=4) return months.map(L).join('، ');
  return L(months[0])+' ← '+L(months[months.length-1])+' ('+months.length+' أشهر)';
}
function promoStockMap(){
  const m = new Map();
  for(const r of latestBranchInv()) m.set(r.itemCode+'|'+r.branch, r.qty);
  return m;
}
// item×branch cells with their sales in the period; codeSet limits the items (null = every item)
function promoSalesCells(months, codeSet){
  const ms = new Set(months), cells = new Map();
  for(const r of DB.monthlySales){
    if(!ms.has(r.month)) continue;
    if(codeSet && !codeSet.has(r.itemCode)) continue;
    const k = r.itemCode+'|'+r.branch;
    let c = cells.get(k);
    if(!c){ c = {itemCode:r.itemCode, branch:r.branch, sales:0, nameFile:r.itemName||''}; cells.set(k, c); }
    c.sales += r.qty;
  }
  return cells;
}
function promoFinish(o, itemsMap, bMap){
  const it = itemsMap.get(o.itemCode)||{};
  const price = Number(it.price)||0;
  o.itemName = it.name || o.nameFile || '';
  o.group = it.group || '';
  o.branchName = bMap.get(o.branch)||'';
  o.pct = o.prev>0 ? (o.sales/o.prev)*100 : null;
  o.value = o.sales*price;
  return o;
}
function promoMainRows(){
  const codeSet = new Set(DB.promoItems.map(x=>x.code));
  if(!codeSet.size) return [];
  const months = promoPeriodMonths();
  const cells = promoSalesCells(months, codeSet);
  const stockMap = promoStockMap();
  for(const [k, q] of stockMap){
    const sep = k.lastIndexOf('|'), code = k.slice(0, sep);
    if(!codeSet.has(code)) continue;
    if(!cells.has(k)) cells.set(k, {itemCode:code, branch:k.slice(sep+1), sales:0, nameFile:''});
  }
  const itemsMap = new Map(DB.items.map(i=>[i.code,i])), bMap = branchNameMap();
  const out = [];
  for(const [k, c] of cells){
    c.stock = stockMap.get(k)||0;
    if(c.stock===0 && c.sales===0) continue;
    c.prev = c.stock + c.sales;
    out.push(promoFinish(c, itemsMap, bMap));
  }
  out.sort((a,b)=>collNum.compare(a.itemCode,b.itemCode) || collNum.compare(a.branch,b.branch));
  return out;
}
function promoExpiryRows(){
  if(!DB.expiry.length) return [];
  const months = promoPeriodMonths();
  const sales = promoSalesCells(months, null);
  const stockMap = promoStockMap();
  const agg = new Map();                       // one row per item×branch: batches are summed so nothing is counted twice
  for(const r of DB.expiry){
    const k = r.itemCode+'|'+r.branch;
    let a = agg.get(k);
    if(!a){ a = {itemCode:r.itemCode, branch:r.branch, prev:0, batches:0, expiryDate:r.expiryDate, nameFile:''}; agg.set(k, a); }
    a.prev += r.qty; a.batches++;
    if(r.expiryDate && (!a.expiryDate || r.expiryDate < a.expiryDate)) a.expiryDate = r.expiryDate;
  }
  const itemsMap = new Map(DB.items.map(i=>[i.code,i])), bMap = branchNameMap();
  const out = [];
  for(const [k, a] of agg){
    const s = sales.get(k);
    a.sales = s ? s.sales : 0;
    if(s && s.nameFile) a.nameFile = s.nameFile;
    a.stock = stockMap.get(k)||0;
    a.days = a.expiryDate ? daysRemaining(a.expiryDate) : null;
    out.push(promoFinish(a, itemsMap, bMap));
  }
  out.sort((a,b)=>collNum.compare(a.itemCode,b.itemCode) || collNum.compare(a.branch,b.branch));
  return out;
}
function promoRows(view){ return (view||promoState().view)==='exp' ? promoExpiryRows() : promoMainRows(); }
function promoFilteredRows(){
  const st = promoState();
  let rows = promoRows(st.view);
  rows = applySearch(rows, ['itemCode','itemName','branch','branchName','group'], st.q);
  if(st.branch) rows = rows.filter(r=>r.branch===st.branch);
  return rows;
}
// per-branch comparison: avgPct = mean of the branch's per-item sell-through % (items with previous stock > 0 only)
function promoBranchStats(rows){
  const map = new Map(), bMap = branchNameMap();
  for(const r of rows){
    let b = map.get(r.branch);
    if(!b){ b = {branch:r.branch, name:bMap.get(r.branch)||r.branch, rows:0, sales:0, prev:0, value:0, pctSum:0, pctN:0}; map.set(r.branch, b); }
    b.rows++; b.sales += r.sales; b.prev += r.prev; b.value += r.value;
    if(r.pct!=null){ b.pctSum += r.pct; b.pctN++; }
  }
  return Array.from(map.values()).map(b=>({...b, avgPct: b.pctN ? b.pctSum/b.pctN : 0}));
}
const fmt2 = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('en-US', {maximumFractionDigits:2});

function importPromoItems(file){
  if(!file) return;
  readSheetRowsWithHeader(file, async (header, rest)=>{
    const h0 = header.map(x=>String(x==null?'':x).trim());
    const isHeader = h0.some(h=>/رقم|كود|صنف|code|item|id/i.test(h));
    let idx = h0.findIndex(h=>/رقم الصنف|كود الصنف|كود|code|item/i.test(h)); if(idx<0) idx = 0;
    const rows = isHeader ? rest : [header].concat(rest);
    const seen = new Set(), codes = [];
    for(const r of rows){
      const v = r[idx]; if(v==null || v==='') continue;
      const c = String(typeof v==='number' ? v : v).trim();
      if(c && !seen.has(c)){ seen.add(c); codes.push(c); }
    }
    if(!codes.length){ uiAlert('لم يتم العثور على أي رقم صنف في الملف. ضع أرقام الأصناف في العمود الأول (أو في عمود عنوانه "رقم الصنف").'); return; }
    if(DB.promoItems.length && !(await uiConfirm('توجد قائمة أصناف عروض محفوظة ('+DB.promoItems.length.toLocaleString()+' صنف). سيتم استبدالها بقائمة الملف ('+codes.length.toLocaleString()+' صنف). متابعة؟', {okText:'استبدال القائمة'}))) return;
    DB.promoItems = codes.map(code=>({code}));
    const ok = await saveDB('promoItems');
    const known = new Set(DB.items.map(i=>i.code));
    const missing = DB.items.length ? codes.filter(c=>!known.has(c)) : [];
    const st = promoState(); st.view = 'main'; st.page = 1;
    render();
    let msg = 'تم استيراد '+codes.length.toLocaleString()+' صنف'+(ok?' وحفظها في هذا المتصفح.':' لكن فشل الحفظ في المتصفح.');
    if(missing.length) msg += '\n\n'+missing.length.toLocaleString()+' رقم غير موجود في صفحة الأصناف (سيظهر بدون اسم أو مجموعة إن كانت له مبيعات أو مخزون): '+missing.slice(0,8).join('، ')+(missing.length>8?' ...':'');
    uiAlert(msg);
  });
}

function togglePromoMonth(m, on){
  const st = promoState(); st.picked = st.picked||[];
  const i = st.picked.indexOf(m);

function promoSheetRows(view){

    const o = {'رقم الصنف':r.itemCode,'الاسم':r.itemName,'المجموعة':r.group,'الفرع':r.branch,'اسم الفرع':r.branchName};
    if(view==='exp'){ o['المخزون السابق (المرفوع)']=r.prev; o['أقرب انتهاء']=r.expiryDate||''; o['الأيام المتبقية']=r.days==null?'':r.days; o['المخزون الحالي']=r.stock; o['المبيعات']=r.sales; }

// ---- comparison charts (inline SVG with literal colours so the same markup can be exported as an image) ----
const PM_METRICS = {
  pct:   {title:'نسبة البيع الإجمالية — مبيعات الفرع ÷ مخزونه السابق', unit:'%', get:s=>s.prev>0 ? s.sales/s.prev*100 : 0, file:'مقارنة_نسبة_البيع_الإجمالية_بين_الفروع'},
  sales: {title:'قيمة مبيعات الفرع من هذه الأصناف (ر.س)', unit:'', get:s=>s.value, file:'مقارنة_قيمة_المبيعات_بين_الفروع'},
  qty:   {title:'إجمالي مبيعات الفرع (كمية)', unit:'', get:s=>s.sales, file:'مقارنة_إجمالي_كمية_المبيعات_بين_الفروع'}
};
function pmNiceMax(v){
  if(!(v>0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
  for(const s of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(f<=s+1e-9) return s*p;
  return 10*p;
}
function pmTrunc(s, n){ s = String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function promoBarsSvg(stats, metric, o){
  o = o || {};
  const M = o.M || PM_METRICS[metric];
  const data = (o.items ? o.items.slice() : stats.map(s=>({s, v:M.get(s)})));
  if(!o.keepOrder) data.sort((a,b)=>b.v-a.v);
  if(!data.length) return {svg:'', w:0, h:0};
  const W = 720, rowH = 32, barH = 18, labelW = 190, left = 96, top = o.title ? 70 : 8, bottom = 30 + (o.legend ? 22 : 0);
  const x0 = W - labelW - 8;                 // bars start here and grow leftwards (RTL)
  const maxLen = x0 - left - 4;
  const nm = o.max || pmNiceMax(Math.max.apply(null, data.map(d=>d.v)));
  const H = top + data.length*rowH + bottom;
  const F = `font-family="IBM Plex Sans Arabic, Tahoma, Arial, sans-serif"`;
  let g = '';
  for(let i=0;i<=4;i++){
    const x = x0 - maxLen*i/4, val = nm*i/4;
    g += `<line x1="${x}" x2="${x}" y1="${top-4}" y2="${top+data.length*rowH}" stroke="#E3E2D9" stroke-width="1"/>`;
    g += `<text x="${x}" y="${H-10-(o.legend?22:0)}" text-anchor="middle" font-size="10.5" fill="#6B7280" ${F}>${fmt2(val)}${M.unit}</text>`;
  }
  data.forEach((d, i)=>{
    const y = top + i*rowH + (rowH-barH)/2;
    const len = Math.max(2, d.v/nm*maxLen), x = x0 - len;
    const col = d.color || promoBranchColor(d.s.branch);
    const tip = d.tip || d.s.name+'\n'+(metric==='pct' ? 'نسبة البيع الإجمالية: '+fmt2(d.v)+'%' : (metric==='qty' ? 'إجمالي كمية المبيعات: '+fmt2(d.s.sales) : 'قيمة المبيعات: '+fmt2(d.s.value)+' ر.س'))+'\nكمية المبيعات: '+fmt2(d.s.sales)+'\nإجمالي المخزون السابق: '+fmt2(d.s.prev)+'\nمتوسط نسب الأصناف: '+fmt2(d.s.avgPct)+'%';
    const inter = o.interactive!==false;
    g += `<g class="pm-bar"${inter?` data-tip="${escAttr(tip)}" onclick="${d.click || `promoPickBranch('${escAttr(d.s.branch)}')`}" style="cursor:pointer"`:''}>
      <rect x="${left-4}" y="${top+i*rowH}" width="${W-left}" height="${rowH}" fill="transparent"/>
      ${o.track?`<rect x="${x0-maxLen}" y="${y}" width="${maxLen}" height="${barH}" rx="4" fill="${o.track}"/>`:''}
      <rect class="pm-fill" x="${x}" y="${y}" width="${len}" height="${barH}" rx="4" fill="${col}"/>
      <text x="${x-6}" y="${y+barH/2+4}" text-anchor="end" font-size="12" font-weight="700" fill="#16233A" ${F}>${fmt2(d.v)}${M.unit}</text>
      <text x="${W-8}" y="${y+barH/2+4}" text-anchor="end" font-size="12" fill="#16233A" ${F}>${escAttr(pmTrunc(d.label || d.s.name, 26))}</text>
    </g>`;
  });
  if(o.legend){
    let lx = W-12;
    for(const L of o.legend){
      const tw = L.label.length*6.3+22;
      g += `<rect x="${lx-10}" y="${H-19}" width="10" height="10" rx="2" fill="${L.color}"/><text x="${lx-16}" y="${H-10}" text-anchor="end" font-size="11" fill="#6B7280" ${F}>${escAttr(L.label)}</text>`;
      lx -= tw + 14;
    }
  }
  let head = '';
  if(o.title){
    head = `<text x="${W-12}" y="26" text-anchor="end" font-size="15" font-weight="700" fill="#0B1F3D" ${F}>${escAttr(o.title)}</text>
      <text x="${W-12}" y="48" text-anchor="end" font-size="11.5" fill="#6B7280" ${F}>${escAttr(o.sub||'')}</text>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" direction="ltr" style="max-width:100%;height:auto;display:block;direction:ltr">${o.title?`<rect width="${W}" height="${H}" fill="#fcfcfb"/>`:''}${head}${g}</svg>`;
  return {svg, w:W, h:H};
}
// ---- all-branches level: every branch combined, broken down per item ----
const PM_ALL = {
  pct:   {label:'نسبة البيع الإجمالية', unit:'%'},
  value: {label:'قيمة المبيعات (ر.س)', unit:''},
  qty:   {label:'كمية المبيعات', unit:''},
  prev:  {label:'المخزون السابق', unit:''}
};
let pmAllMetric = 'pct', pmAllTop = 15;
function promoAllTotals(rows){
  const t = {items:new Set(), branches:new Set(), sales:0, prev:0, value:0};
  for(const r of rows){ t.items.add(r.itemCode); t.branches.add(r.branch); t.sales += r.sales; t.prev += r.prev; t.value += r.value; }
  t.pct = t.prev>0 ? t.sales/t.prev*100 : 0;
  return t;
}
function promoAllItems(rows){
  const m = new Map();
  for(const r of rows){
    let x = m.get(r.itemCode);
    if(!x){ x = {code:r.itemCode, name:r.itemName||r.itemCode, sales:0, prev:0, value:0, br:new Set()}; m.set(r.itemCode, x); }
    x.sales += r.sales; x.prev += r.prev; x.value += r.value; x.br.add(r.branch);
  }
  return Array.from(m.values()).map(x=>({...x, pct: x.prev>0 ? x.sales/x.prev*100 : 0}));
}
function promoAllSvg(view, o){
  o = o || {};
  const rows = promoRows(view), list = promoAllItems(rows), K = pmAllMetric;
  const val = x => K==='pct' ? x.pct : K==='value' ? x.value : K==='qty' ? x.sales : x.prev;
  const top = list.map(x=>({x, v:val(x)})).sort((a,b)=>b.v-a.v).slice(0, pmAllTop);
  const items = top.map(({x,v})=>({
    v, label:x.name, color:'#2a78d6', click:`promoPickItem('${escAttr(x.code)}')`,
    tip: x.name+' ('+x.code+')\nعلى مستوى '+x.br.size+' فرع\nكمية المبيعات: '+fmt2(x.sales)+'\nالمخزون السابق: '+fmt2(x.prev)+'\nنسبة البيع الإجمالية: '+fmt2(x.pct)+'%\nقيمة المبيعات: '+fmt2(x.value)+' ر.س'}));
  const meta = promoChartMeta(view);
  return promoBarsSvg([], K, Object.assign({}, o, {items, M:{unit:PM_ALL[K].unit}, title:o.title ? 'على مستوى كل الفروع — '+PM_ALL[K].label+' (أعلى '+items.length+' أصناف)' : '', sub:meta.sub}));
}

function promoExportSvg(metric){
  if(metric==='all') return promoAllSvg(pmChartView, {title:true, interactive:false});
  if(metric==='avail') return availSvg({title:true, interactive:false});

function svgToPngBlob(svg, w, h, scale){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const c = document.createElement('canvas'); c.width = w*scale; c.height = h*scale;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fcfcfb'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b=> b ? resolve(b) : reject(new Error('toBlob')), 'image/png');
      }catch(e){ reject(e); }
    };
    img.onerror = ()=>reject(new Error('svg-image'));
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
async function promoDownloadChart(metric, fmt){
  const ex = promoExportSvg(metric); if(!ex.svg) return;
  const name = metric==='all' ? 'مقارنة_على_مستوى_كل_الفروع_'+pmAllMetric : metric==='avail' ? 'نسبة_توافر_الأصناف_في_الفروع' : PM_METRICS[metric].file;
  try{
    if(fmt==='svg') await triggerDownload(name+'.svg', new Blob([ex.svg], {type:'image/svg+xml'}));
    else await triggerDownload(name+'.png', await svgToPngBlob(ex.svg, ex.w, ex.h, 2));
  }catch(e){ uiAlert('تعذر إنشاء الصورة: '+e.message); }
}
async function promoCopyChart(metric){
  const ex = promoExportSvg(metric); if(!ex.svg) return;
  try{
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
    await navigator.clipboard.write([new ClipboardItem({'image/png': svgToPngBlob(ex.svg, ex.w, ex.h, 2)})]);
    uiAlert('تم نسخ المخطط كصورة — يمكنك لصقه مباشرة في Word أو البريد أو واتساب.');
  }catch(e){
    uiAlert('المتصفح أو إطار العرض يمنع النسخ إلى الحافظة هنا. استخدم "تنزيل PNG" بدلًا من ذلك، أو افتح النظام في نافذة متصفح مستقلة ثم أعد المحاولة.');
  }
}

// auto order = target − stock available in branches + central warehouses (never below 0, rounded up to whole units).
const AUTO_TOP_OPTIONS = [10,100,500,1000,1500,2000,0];
function autoState(){ const s = ps('autoorder'); if(s.top==null){ s.top = 0; s.supplier=''; s.group=''; s.movement=''; s.need=''; } return s; }
function autoOrderRows(){
  const stop = stoppedSet();
  const an = itemAnalysis().filter(it=>!stop.has(it.code));
  an.sort((a,b)=> b.avgMonthly-a.avgMonthly || collNum.compare(a.code,b.code));
  return an.map((it,i)=>{
    const rank = i+1, avg = it.avgMonthly;
    const mult = (rank<=2000 && avg>0) ? 3 : 2;
    const target = avg*mult;
    const order = Math.max(0, Math.ceil(target - it.qty - 1e-9));
    return {rank, code:it.code, barcode:it.barcode||'', name:it.name, group:it.group||'', movement:it.movement, supplier:it.supplier||'',
      avg, mult, target, stock:it.qty, order, avail: target>0 ? it.qty/target*100 : null};
  });
}
function autoFilteredRows(){
  const st = autoState();
  let rows = autoOrderRows();
  if(st.top) rows = rows.filter(r=>r.rank<=st.top);
  if(st.supplier) rows = rows.filter(r=>r.supplier===st.supplier);
  if(st.group) rows = rows.filter(r=>r.group===st.group);
  if(st.movement) rows = rows.filter(r=>r.movement===st.movement);
  if(st.need==='1') rows = rows.filter(r=>r.order>0);
  const lo = st.availMin===''||st.availMin==null ? null : Number(st.availMin), hi = st.availMax===''||st.availMax==null ? null : Number(st.availMax);

// ---- availability of the best-selling items per branch ----
// Default "best seller" threshold per branch (units per month); matched to branch names, editable and saved.
const AUTO_RULES = [['ابو عريش',12],['صبيا',12],['جيزان',12],['صامطة',12],['محايل',11],['بيش',8],['احد المسارحة',8],
  ['السويس',6],['فارما الحصمة',6],['مخطط 8',6],['فرسان',6],['الحقو',5],['جدة',5],['الزيتونة الحصمة',4],['الريث',4]];
function normAr(s){
  return String(s||'').replace(/[ً-ْـ]/g,'').replace(/فرع/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/جازان/g,'جيزان').replace(/[^ء-ي0-9a-zA-Z]/g,'').toLowerCase();
}
function autoDefaultThresholds(){
  const def = new Map(), unmatched = [];
  const bs = DB.branches.map(b=>({code:b.code, n:normAr(b.name)}));
  for(const [key,min] of AUTO_RULES){
    const k = normAr(key);
    let hits = bs.filter(b=>b.n===k);
    if(!hits.length) hits = bs.filter(b=>b.n.includes(k));
    if(hits.length===1) def.set(hits[0].code, min); else unmatched.push(key);
  }
  return {def, unmatched};
}
function autoThresholds(){
  const {def, unmatched} = autoDefaultThresholds();
  const eff = new Map(def);
  for(const o of DB.autoThresholds) eff.set(o.branch, Number(o.min)||0);
  return {eff, def, unmatched};
}
async function setAutoThreshold(code, val){
  const v = Math.max(0, Number(val)||0);
  DB.autoThresholds = DB.autoThresholds.filter(o=>o.branch!==code).concat([{branch:code, min:v}]);
  await saveDB('autoThresholds'); openAvailability();
}

function autoBranchAvgMap(){
  // Read from the "متوسط المبيعات الشهرية" page (DB.sales); only if it is empty fall back to the monthly-sales page.
  if(DB.sales.length) return salesByItemBranch();
  const months = monthlySalesMonths();

  ov.innerHTML = `<div class="ui-dialog" style="max-width:560px;margin:auto">
    <div class="ui-msg" style="max-height:none;margin-bottom:8px">استعادة نسخة احتياطية${obj.createdAt?' بتاريخ '+fmtDateTime(obj.createdAt):''}. سيتم <b>استبدال</b> بيانات الأقسام المحددة بما في الملف، أما الأقسام غير المحددة وغير الموجودة في الملف فلا تتغير.</div>
    <div style="max-height:45vh;overflow:auto;margin-bottom:10px">${rowsHtml}</div>
    <label style="display:flex;gap:6px;align-items:center;font-size:12.5px;margin-bottom:12px"><input type="checkbox" id="rs-pre" ${backupTotalRows()>0?'checked':'disabled'}> تنزيل نسخة من بياناتي الحالية قبل الاستبدال</label>
    <div class="ui-actions"><button class="btn danger" id="rs-go">استعادة</button><button class="btn ghost" id="rs-cancel">إلغاء</button></div></div>`;
  document.body.appendChild(ov);

  const svg = el.closest('svg'); if(!svg) return;
  const n = svg.querySelector('.mg-dc-n'), l = svg.querySelector('.mg-dc-l');
  n.textContent = on ? el.getAttribute('data-n') : svg.getAttribute('data-defn');
  l.textContent = on ? el.getAttribute('data-l') : svg.getAttribute('data-defl');
  svg.classList.toggle('mg-hov', !!on);
  svg.querySelectorAll('.mg-seg').forEach(s=>s.style.opacity = (!on || s===el) ? '1' : '.35');
}
function mgDonutHtml(labels, values, colors, clicks, centerN, centerL, unitWord){
  const size=190, r=size/2-16, cx=size/2, cy=size/2, circ=2*Math.PI*r, total=values.reduce((a,b)=>a+b,0);
  let off=0;
  const segs = total>0 ? values.map((v,i)=>{
    const f=v/total, d=Math.max(f*circ-(f>0?2:0),0);
    const tip = labels[i]+'\n'+unitWord+': '+v.toLocaleString()+'\nالنسبة: '+(f*100).toFixed(1)+'%';
    const s = `<circle class="mg-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="26" stroke-dasharray="${d} ${circ-d}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" data-tip="${escAttr(tip)}" data-l="${escAttr(labels[i])}" data-n="${v.toLocaleString()} (${(f*100).toFixed(1)}%)" onmouseenter="mgDonutHover(this,true)" onmouseleave="mgDonutHover(this,false)" ${clicks&&clicks[i]?`onclick="${clicks[i]}" style="cursor:pointer"`:''}/>`;
    off+=f*circ; return s;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E3E2D9" stroke-width="26"/>`;
  const legend = labels.map((l,i)=>`<div class="legend-item" data-tip="${escAttr(labels[i]+'\n'+unitWord+': '+values[i].toLocaleString())}"${clicks&&clicks[i]?` onclick="${clicks[i]}"`:''}><span style="width:10px;height:10px;border-radius:3px;background:${colors[i]};display:inline-block"></span><span dir="ltr">${l}</span>: ${values[i].toLocaleString()} (${total?(values[i]/total*100).toFixed(1):0}%)</div>`).join('');
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" width="190" height="190" data-defn="${escAttr(centerN)}" data-defl="${escAttr(centerL)}">${segs}<text class="mg-dc-n" x="${cx}" y="${cy+4}" text-anchor="middle" font-size="18" font-weight="700" fill="#0B1F3D">${centerN}</text><text class="mg-dc-l" x="${cx}" y="${cy+24}" text-anchor="middle" font-size="11" fill="#6B7280" direction="ltr">${centerL}</text></svg><div style="display:flex;flex-direction:column;gap:3px">${legend}</div></div>`;
}
function mgRowsFromItems(items, unitLabel){
  return items.map(d=>{
    const o = {'البيان': d.label}; o[unitLabel] = Math.round(d.v*100)/100;
    String(d.tip||'').split('\n').slice(1).forEach(line=>{ const k = line.indexOf(': '); if(k>0) o[line.slice(0,k)] = line.slice(k+2); });
    return o;
  });
}
function mgRegBar(id, title, items, bo, unitLabel){

  mgExp[id] = {title, svg:ex.svg, w:ex.w, h:ex.h, rows:mgRowsFromItems(items, unitLabel)};
}

function mgRegDonut(id, title, labels, values, colors, o){
  o = o || {};
  const unitTxt = o.unit==null ? ' صنف' : (o.unit ? ' '+o.unit : '');
  const F = 'font-family="IBM Plex Sans Arabic, Tahoma, Arial, sans-serif"';
  const W = 720, H = Math.max(340, 100+labels.length*34+30), cx = 150, cy = Math.round(H/2)+10, r = 90, circ = 2*Math.PI*r, total = values.reduce((a,b)=>a+b,0);

  else segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E3E2D9" stroke-width="40"/>`;
  const leg = labels.map((l,i)=>`<rect x="${W-30}" y="${95+i*34}" width="12" height="12" rx="3" fill="${colors[i]}"/><text x="${W-40}" y="${106+i*34}" text-anchor="end" font-size="13" fill="#16233A" ${F}>\u2068${escAttr(l)}\u2069 — \u2067\u2066${values[i].toLocaleString()}\u2069${unitTxt} · \u2066${total?(values[i]/total*100).toFixed(1):0}%\u2069\u2069</text>`).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" direction="ltr"><rect width="${W}" height="${H}" fill="#fcfcfb"/><text x="${W-12}" y="30" text-anchor="end" font-size="15" font-weight="700" fill="#0B1F3D" ${F}>${escAttr(title)}</text>${segs}<text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F3D" ${F}>${escAttr(o.centerN!=null ? o.centerN : total.toLocaleString())}</text>${o.centerL?`<text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="12" fill="#6B7280" ${F}>${escAttr(o.centerL)}</text>`:''}${leg}</svg>`;
  mgExp[id] = {title, svg, w:W, h:H, rows:labels.map((l,i)=>({'الفئة':l,'عدد الأصناف':values[i],'النسبة %':total?Math.round(values[i]/total*1000)/10:0}))};
}
async function mgCopy(id){
  const ex = mgExp[id]; if(!ex || !ex.svg){ uiAlert('لا توجد بيانات لنسخها.'); return; }
  try{
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
    await navigator.clipboard.write([new ClipboardItem({'image/png': svgToPngBlob(ex.svg, ex.w, ex.h, 2)})]);
    uiAlert('تم نسخ المؤشر كصورة — يمكنك لصقه مباشرة في Word أو البريد أو واتساب.');
  }catch(e){ uiAlert('المتصفح أو إطار العرض يمنع النسخ إلى الحافظة هنا. استخدم "PNG" أو "Excel" بدلًا من ذلك، أو افتح النظام في نافذة متصفح مستقلة ثم أعد المحاولة.'); }
}
async function mgPng(id){
  const ex = mgExp[id]; if(!ex || !ex.svg){ uiAlert('لا توجد بيانات للتنزيل.'); return; }
  try{ await triggerDownload('مؤشر_'+ex.title.replace(/[\\\/:*?"<>|\s]+/g,'_')+'.png', await svgToPngBlob(ex.svg, ex.w, ex.h, 2)); }
  catch(e){ uiAlert('تعذر إنشاء الصورة: '+e.message); }
}
async function mgXlsx(id){
  const ex = mgExp[id]; if(!ex || !ex.rows.length){ uiAlert('لا توجد بيانات للتصدير.'); return; }
  await exportRowsExcel(ex.rows, 'مؤشر_'+ex.title.replace(/[\\\/:*?"<>|\s]+/g,'_'));
}
async function mgXlsxAll(){
  const ids = Object.keys(mgExp); if(!ids.length) return;
  const wb = XLSX.utils.book_new();
  const used = new Set();
  ids.forEach((id,i)=>{
    const ex = mgExp[id]; if(!ex.rows.length) return;
    let nm = (id.startsWith('k')?'مؤشر ':'')+ex.title.replace(/[\\\/?*\[\]:]/g,' ').slice(0,27); if(used.has(nm)) nm = nm.slice(0,25)+' '+(i+1); used.add(nm);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ex.rows), nm);
  });
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const ok = await triggerDownload('لوحة_مؤشرات_الإدارة.xlsx', new Blob([out], {type:'application/octet-stream'}));
  if(!ok) uiAlert('تعذر تنزيل الملف. جرّب فتح النظام في نافذة متصفح مستقلة ثم أعد المحاولة.');
}

// ================= تدوير المقربات: اقتراحات + تنفيذ + سجل العمليات =================
// For each near-expiry batch the branch keeps what its own monthly sales can clear before the expiry date
// (floor of "expected sold"); the rest is offered to other branches that can still sell it in time
// (their monthly average × the days left after transit − the stock they already hold); whatever nobody can
// absorb is flagged for return to the supplier (if returnable) or for promotion / clearance.
const EXP_TRANSIT_DAYS = 4;
var expSel = new Set();
var expGroupOpen = false;
function expSt(){ const s = ps('expiry'); if(s.view==null){ s.view='plan'; s.kind=''; s.ret=''; s.status='open'; s.groups=[]; } return s; }
function expPlan(){
  const rows = expiryAnalysis();                     // already ordered by days remaining
  const sIB = salesByItemBranch();
  const inv = new Map(latestBranchInv().map(r=>[r.itemCode+'|'+r.branch, r.qty]));
  const bMap = branchNameMap(), branches = DB.branches.map(b=>b.code);
  const alloc = new Map(), lines = [];
  for(const r of rows){
    if(r.days==null || !(r.qty>0)) continue;
    const keep = Math.max(0, Math.min(r.qty, Math.floor(r.expectedSold + 1e-9)));
    let left = r.qty - keep;
    if(left<=0) continue;                            // the branch will sell all of it itself
    const minQ = minTransferQty(r.group);
    const base = {itemCode:r.itemCode, barcode:r.barcode||'', name:r.name, group:r.group||'', supplier:r.supplier||'', returnable:!!r.returnable, cost:r.cost||0,
      expiryDate:r.expiryDate, days:r.days, urgency:r.urgency, from:r.branch, fromName:r.branchName||bMap.get(r.branch)||'', batchQty:r.qty, keep};
    if(r.days > EXP_TRANSIT_DAYS){
      const cands = branches.filter(b=>b!==r.branch).map(b=>{
        const avg = sIB.get(r.itemCode+'|'+b)||0, stock = inv.get(r.itemCode+'|'+b)||0, al = alloc.get(r.itemCode+'|'+b)||0;
        return {b, avg, stock, cap: Math.floor(avg*(r.days-EXP_TRANSIT_DAYS)/30 - stock - al + 1e-9)};
      }).filter(c=>c.avg>0 && c.cap>=1).sort((a,b)=>b.cap-a.cap);
      for(const c of cands){
        if(left<=0) break;
        const q = Math.min(c.cap, left);
        if(q < minQ) continue;
        lines.push({...base, kind:'rotate', qty:q, to:c.b, toName:bMap.get(c.b)||'', toAvg:c.avg, toStock:c.stock, toCap:c.cap,
          key:['rotate',r.itemCode,r.expiryDate,r.branch,c.b].join('|')});
        alloc.set(r.itemCode+'|'+c.b, (alloc.get(r.itemCode+'|'+c.b)||0)+q); left -= q;
      }
    }
    if(left>0){
      const kind = r.returnable ? 'return' : 'promo';
      lines.push({...base, kind, qty:left, to:'', toName:'', toAvg:0, toStock:0, toCap:0, key:[kind,r.itemCode,r.expiryDate,r.branch].join('|')});
    }
  }
  return lines;
}
function expExecutedMap(){
  const m = new Map();
  for(const b of DB.expRot) for(const it of b.items) m.set(it.key, b.seq);
  return m;
}
function expDayMatch(d, st){
  const lo = st.dMin===''||st.dMin==null ? null : Number(st.dMin), hi = st.dMax===''||st.dMax==null ? null : Number(st.dMax);
  if(lo==null && hi==null) return true;
  if(d==null) return false;
  return (lo==null || d>=lo) && (hi==null || d<=hi);
}
function expCommonFilter(rows, st, fromField){
  rows = applySearch(rows, ['itemCode','barcode','name','group','supplier','from','fromName','to','toName'], st.q);
  if(st.groups && st.groups.length) rows = rows.filter(r=>st.groups.includes(r.group));
  if(st.ret==='yes') rows = rows.filter(r=>r.returnable);
  if(st.ret==='no') rows = rows.filter(r=>!r.returnable);
  if(st.fromB) rows = rows.filter(r=>r[fromField]===st.fromB);
  rows = rows.filter(r=>expDayMatch(r.days, st));
  return rows;
}
function expPlanFiltered(){
  const st = expSt(), ex = expExecutedMap();
  let rows = expCommonFilter(expPlan(), st, 'from');
  if(st.toB) rows = rows.filter(r=>r.to===st.toB);
  if(st.kind) rows = rows.filter(r=>r.kind===st.kind);
  rows = rows.map(r=>({...r, done: ex.get(r.key)||0}));
  if(st.status==='open') rows = rows.filter(r=>!r.done || r.kind!=='rotate');
  else if(st.status==='done') rows = rows.filter(r=>r.done);
  return rows.slice().sort(expPlanCompare);
}
// Same printing order as the transfer: destination branch → group A→Z (no group last) → source branch → (days left instead of priority) → item code.
function expRotateCompare(a,b){
  const toC = collNum.compare(String(a.to), String(b.to)); if(toC) return toC;
  const ga = a.group||'', gb = b.group||'';
  if(ga!==gb){ if(!ga) return 1; if(!gb) return -1; return collAr.compare(ga, gb) || (ga<gb?-1:1); }
  return collNum.compare(String(a.from), String(b.from)) || ((a.days??9999)-(b.days??9999)) || collNum.compare(String(a.itemCode), String(b.itemCode));
}
function expPlanCompare(a,b){
  const ra = a.kind==='rotate' ? 0 : 1, rb = b.kind==='rotate' ? 0 : 1;
  if(ra!==rb) return ra-rb;
  if(ra===0) return expRotateCompare(a,b);
  const ga = a.group||'', gb = b.group||'';
  return collNum.compare(String(a.from), String(b.from)) || (ga!==gb ? (!ga?1:!gb?-1:collAr.compare(ga,gb)) : 0) || ((a.days??9999)-(b.days??9999)) || collNum.compare(String(a.itemCode), String(b.itemCode));
}
function expBatchesFiltered(){
  const st = expSt();
  return expCommonFilter(expiryAnalysis().map(r=>({...r, from:r.branch, fromName:r.branchName, to:'', toName:''})), st, 'from');
}
const EXP_KIND = {rotate:'🔁 تدوير إلى فرع آخر', return:'↩️ إرجاع للمورد', promo:'🏷️ عرض / تصريف'};

    'من فرع':r.from,'اسم الفرع (من)':r.fromName,'كمية الدفعة':r.batchQty,'تاريخ الانتهاء':r.expiryDate,'الأيام المتبقية':r.days,'يبقى في الفرع (يصرّفه)':r.keep,
    'إلى فرع':r.to,'اسم الفرع (إلى)':r.toName,'مخزون الفرع المحوَّل إليه':r.kind==='rotate'?r.toStock:'','متوسط بيعه الشهري':r.kind==='rotate'?Math.round(r.toAvg*10)/10:'','الكمية':r.qty,
    'القيمة':Math.round(r.qty*r.cost*100)/100}));
}

  return parts.join(' — ');
}

function expRotateCompare2(a,b){ return expRotateCompare({to:a.to, group:a.group, from:a.from, days:a.days, itemCode:a.itemCode}, {to:b.to, group:b.group, from:b.from, days:b.days, itemCode:b.itemCode}); }
async function expExecute(mode){
  const all = expPlanFiltered().filter(r=>r.kind==='rotate' && !r.done);
  const lines = mode==='all' ? all : all.filter(r=>expSel.has(r.key));
  if(!lines.length){ uiAlert(mode==='all' ? 'لا توجد أسطر تدوير غير منفذة ضمن الفلترة الحالية.' : 'حدد سطر تدوير واحدًا على الأقل قبل التنفيذ.'); return; }
  const qty = lines.reduce((a,r)=>a+r.qty,0);
  if(!(await uiConfirm('سيتم تسجيل عملية تدوير مقربات فيها '+lines.length.toLocaleString()+' سطر (إجمالي '+qty.toLocaleString()+' قطعة). الكمية التي يستطيع الفرع المحوَّل منه تصريفها تبقى فيه. متابعة؟', {okText:'تنفيذ التدوير'}))) return;
  const sorted = lines.slice().sort(expRotateCompare);
  const batch = {id:'e'+Date.now(), seq: Math.max(0, ...DB.expRot.map(b=>b.seq||0)) + 1, kind:'expiry', executedAt:new Date().toISOString(),
    fromCodes:Array.from(new Set(sorted.map(r=>r.from))),
    items: sorted.map(r=>({key:r.key, itemCode:r.itemCode, itemName:r.name, barcode:r.barcode, group:r.group, from:r.from, fromName:r.fromName, fromStock:r.batchQty,
      expiryDate:r.expiryDate, days:r.days, to:r.to, toName:r.toName, toStock:r.toStock, qty:r.qty, returnable:r.returnable}))};
  DB.expRot.push(batch);

  if(!ok){ DB.expRot.pop(); uiAlert('تعذر الحفظ محليًا ⚠️ — لم تُسجَّل العملية.'); return; }

}

function toSheetRows(kind){
  if(kind==='invmove' || kind==='invlist') return invMoveSheet(invMoveFiltered(kind), kind);
  if(kind==='suppliers') return filteredSuppliers().map(r=>({'المورد':r.name,'الكود':r.code,'المسؤول':r.contact,'قابل للإرجاع':r.returnable?'نعم':'لا','مدة الإبلاغ':r.reportPeriod,'شروط الإرجاع':r.terms}));
  if(kind==='items') return filteredItemRows().map(a=>({'رقم الصنف':a.code,'الاسم':a.name,'المجموعة':a.group,'المورد':a.supplier,'إجمالي المخزون':a.qty,'مخزون الفروع':a.branchQty,'مخزون المخازن الرئيسية':a.centralQty,'متوسط البيع الشهري':+a.avgMonthly.toFixed(1),'نوع الحركة':a.movement}));
  if(kind==='dead') return deadSheetRows(deadFilteredRows());
  if(kind==='purchases'){
    return filteredPurchaseRows().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.itemName,'المجموعة':r.group,'نوع الحركة':r.movement,'رقم المورد':r.supplierCode,'اسم المورد':r.supplierName,'تاريخ الشراء':r.date,'الكمية':r.qty,'إجمالي المخزون':r.stock,'مخزون الفروع':r.branchStock,'مخزون المخازن الرئيسية':r.centralStock,'متوسط البيع الشهري':+r.avgMonthly.toFixed(1)}));
  }
  if(kind==='monthlysales'){
    const months = monthlySalesMonths();
    return monthlySalesPivotRows().map(r=>{
      const obj = {'رقم الصنف':r.itemCode,'الاسم':r.itemName,'الفرع':r.branch,'اسم الفرع':r.branchName};
      months.forEach(m=>{ obj[m] = r.months[m]!=null? r.months[m] : 0; });
      obj['الإجمالي'] = r.total;
      return obj;
    });
  }
  if(kind==='autoorder') return autoSheetRows();
  if(kind==='promo') return promoSheetRows('main');
  if(kind==='promoexp') return promoSheetRows('exp');
  if(kind==='rotate') return rotationSuggestions().map(r=>({'رقم الصنف':r.code,'الاسم':r.name,'من فرع':r.from,'اسم الفرع (من)':r.fromName,'إلى فرع':r.to,'اسم الفرع (إلى)':r.toName,'الكمية':r.qty,'الأولوية':r.priorityLabel}));
  if(kind==='branches') return branchSummary().map(g=>({'رقم الفرع':g.code,'اسم الفرع':g.name,'عدد الأصناف':g.itemCount,'المخزون':g.qty,'القيمة':g.value,'متوسط المبيعات الشهرية':+g.avgMonthlySales.toFixed(1)}));
  if(kind==='expiry') return expBatchesFiltered().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.name,'المجموعة':r.group,'المورد':r.supplier,'قابل للإرجاع':r.returnable?'نعم':'لا','الفرع':r.branch,'اسم الفرع':r.branchName,'الكمية':r.qty,'تاريخ الانتهاء':r.expiryDate,'الأيام المتبقية':r.days,'متوقع بيعه':+r.expectedSold.toFixed(1),'معرض للخطر':+r.atRisk.toFixed(0),'القيمة':r.value,'الإجراء':r.actionLabel}));
  if(kind==='branchstock') return branchStockRows().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.itemName,'الفرع':r.branch,'اسم الفرع':r.branchName,'المخزون':r.qty,'الحالة':r.statusLabel,'آخر تحديث':r.date}));
  if(kind==='salesavg') return salesAvgRows().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.itemName,'الفرع':r.branch,'اسم الفرع':r.branchName,'متوسط المبيعات الشهرية':+r.avgMonthly.toFixed(1),'التصنيف':r.cls.label}));
  if(kind==='explist') return explistRows().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.itemName,'الفرع':r.branch,'اسم الفرع':r.branchName,'الكمية':r.qty,'تاريخ الانتهاء':r.expiryDate,'الأيام المتبقية':r.days}));
  if(kind==='central') return centralRows().map(r=>({'رقم الصنف':r.itemCode,'الاسم':r.itemName,'المخزن':r.warehouseCode,'اسم المخزن':r.warehouseName,'الكمية':r.qty,'آخر تحديث للمخزون':r.lastUpdate||''}));
  if(kind==='transfer') return DB.transfers.flatMap(b=> b.items.map(r=>({'رقم العملية':batchSeq(b),'رقم الصنف':r.itemCode,'الباركود':r.barcode||'','الاسم':r.itemName,'المجموعة':r.group,'من فرع':r.from,'اسم الفرع (من)':r.fromName,'مخزون الفرع المحوَّل منه':r.fromStock,'إلى فرع':r.to,'اسم الفرع (إلى)':r.toName,'مخزون الفرع المحوَّل إليه':r.toStock,'الكمية المحولة':r.qty,'الأولوية':r.priorityLabel,'تاريخ التنفيذ':new Date(b.executedAt).toLocaleString('ar-SA')})));
  return [];
}

async function triggerDownload(filename, blob){
  try{
    const downloads = await claude.use('downloads');
    if(downloads){
      await downloads.save({filename, data:blob});
      return true;
    }
  }catch(err){
    if(err && err.code==='declined') return true;
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ return false; }
}
async function exportRowsExcel(rows, title){
  if(rows.length===0){ alert('لا توجد بيانات للتصدير.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([out], {type:'application/octet-stream'});
  const ok = await triggerDownload(title+'.xlsx', blob);
  if(!ok) alert('تعذر تنزيل الملف. جرّب فتح النظام في نافذة متصفح مستقلة (وليس داخل لوحة المحادثة) ثم أعد المحاولة.');
}

function fmtDateTime(v){
  const d = (v instanceof Date) ? v : new Date(v);
  if(isNaN(d.getTime())) return '';
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function makeDocRef(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  return 'R-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
// Printable document laid out like an official invoice: company logo, then the system logo + name,
// then the developer, then a framed block with the operation name, number and date.
// The whole header sits in the table's <thead>, so the browser repeats it on every printed page.
function printEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Printed numbers show at most 2 decimals; the "القيمة" column also gets thousands separators.
function printCell(col, v){
  if(v==null) return '';
  if(typeof v==='number' && isFinite(v)){
    const r = Math.round(v*100)/100;
    return col==='القيمة' ? r.toLocaleString('en-US', {maximumFractionDigits:2}) : String(r);
  }
  return printEsc(v);
}
async function exportRowsPDF(rows, title, meta){
  if(rows.length===0){ alert('لا توجد بيانات للتصدير.'); return; }
  meta = meta || {};
  const opName = meta.opName || String(title).replace(/_/g,' ');
  const docLabel = meta.docLabel || 'رقم المستند';
  const docNo = meta.docNo!=null ? meta.docNo : makeDocRef();
  const when = fmtDateTime(meta.date || new Date());
  const extra = (meta.extra||[]).map(([k,v])=>`<div><span class="k">${k}:</span> <b>${v}</b></div>`).join('');
  const cols = Object.keys(rows[0]);
  const thead = '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  const tbody = rows.map(r=>'<tr>'+cols.map(c=>`<td>${printCell(c, r[c])}</td>`).join('')+'</tr>').join('');
  // Reports that have a "القيمة" column show its total in the header, next to the row count.
  const hasValue = cols.includes('القيمة');
  const totalValue = hasValue ? rows.reduce((a,r)=>a+(Number(r['القيمة'])||0), 0) : 0;
  const totalHtml = hasValue ? `<div class="tv"><span class="k">إجمالي القيمة:</span> <b>${(Math.round(totalValue*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})} ر.س</b></div>` : '';
  // Wide tables print landscape, where a tall header would no longer be repeated on every page by the
  // browser (it skips repeating a header that takes too much of the page), so the header is made more compact.
  const land = cols.length > 8;
  const S = land ? {logo:44, icon:22, opname:15, meta:10, pad:4} : {logo:64, icon:30, opname:19, meta:12, pad:10};
  const logoSvg = `<svg width="${S.icon}" height="${S.icon}" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="9" fill="#C9A876"/><path d="M20 7l10 5.5v11L20 29l-10-5.5v-11L20 7z" stroke="#0B1F3D" stroke-width="1.6"/><path d="M10 12.5L20 18l10-5.5M20 18v11" stroke="#0B1F3D" stroke-width="1.6"/><circle cx="27" cy="13" r="4.2" fill="#FAF7EF" stroke="#0B1F3D" stroke-width="1.6"/><line x1="30.1" y1="16.1" x2="32.5" y2="18.5" stroke="#0B1F3D" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const letterhead = `<tr><td class="lh" colspan="${cols.length}">
      <img class="co" src="${COMPANY_LOGO}" alt="Pharma Brand">
      <div class="sys">${logoSvg}<span class="sysname">نظام مراقبة المخزون</span></div>
      ${meta.noDev ? '' : '<div class="dev">المطور: باسم الحذيفي</div>'}
      <div class="opbox"><div class="opname">${opName}</div>
        <div class="meta"><div><span class="k">${docLabel}:</span> <b dir="ltr">${docNo}</b></div>
        <div><span class="k">التاريخ:</span> <b dir="ltr">${when}</b></div>${extra}
        <div><span class="k">عدد الأسطر:</span> <b>${rows.length.toLocaleString()}</b></div>${totalHtml}</div></div>
    </td></tr>`;
  const doc = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${opName} ${docNo}</title>
  <style>
  @page{size:A4 ${land?'landscape':'portrait'};margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#16233A;margin:0}
  table{width:100%;border-collapse:collapse}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  th,td{border:1px solid #C9A876;padding:5px 7px;font-size:11px;text-align:right}
  th{background:#0B1F3D;color:#fff}
  td.lh{border:none;padding:0 0 10px;text-align:center}
  .co{height:${S.logo}px;display:block;margin:0 auto}
  .sys{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:${land?2:6}px}
  .sysname{font-size:15px;font-weight:700;color:#0B1F3D}
  .dev{font-size:11px;color:#B08D4F;font-weight:600;margin-top:2px}
  .opbox{display:inline-block;min-width:55%;margin-top:${S.pad}px;border:2px solid #0B1F3D;border-radius:8px;padding:${land?3:6}px 16px}
  .opname{font-size:${S.opname}px;font-weight:700;color:#0B1F3D}
  .meta{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 24px;font-size:${S.meta}px;margin-top:${land?2:5}px;font-weight:400}
  .meta .k{color:#6B7280}
  .tv{font-size:${S.meta+2}px}
  .tv .k{color:#16233A;font-weight:700}
  .tv b{font-weight:800;font-size:${S.meta+3}px;color:#0B1F3D}
  </style></head>
  <body><table><thead>${letterhead}${thead}</thead><tbody>${tbody}</tbody></table>
  <script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script>
  </body></html>`;
  const blob = new Blob([doc], {type:'text/html'});
  const ok = await triggerDownload(title+'_طباعة.html', blob);
  if(ok) alert('تم تنزيل ملف التقرير. افتحه وسيظهر مربع الطباعة تلقائيًا — اختر "حفظ كـ PDF".');
  else alert('تعذر تنزيل الملف. جرّب فتح النظام في نافذة متصفح مستقلة (وليس داخل لوحة المحادثة) ثم أعد المحاولة.');
}
async function exportExcel(kind){ await exportRowsExcel(toSheetRows(kind), KIND_TITLE[kind]||kind); }
async function exportPDF(kind){ await exportRowsPDF(toSheetRows(kind), KIND_TITLE[kind]||kind, {opName: KIND_DISPLAY[kind]}); }
