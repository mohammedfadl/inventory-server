<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام مراقبة المخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FAF7EF; --surface:#EDEDE8; --surface2:#E3E2D9; --line:#D8D4C4;
  --navy:#0B1F3D; --navy2:#142B52; --gold:#C9A876; --gold-d:#B08D4F;
  --text:#16233A; --muted:#6B7280;
  --red:#DC2626; --orange:#F59E0B; --yellow:#CA9A05; --green:#16A34A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100%}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;color:#fff}
header .sub{color:rgba(255,255,255,.6);font-size:12px}
header .right{display:flex;gap:8px;align-items:center}
header .btn.ghost{border-color:rgba(255,255,255,.3);color:#fff}
header .btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto}
nav button{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.78);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap;transition:.15s}
nav button.active{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
nav button:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:1300px;margin:0 auto;padding:20px;padding-bottom:60px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(11,31,61,.08)}
.card .n{font-size:24px;font-weight:700;color:var(--navy)}
.card .l{color:var(--muted);font-size:12px;margin-top:4px}
.card.red .n{color:var(--red)} .card.orange .n{color:var(--orange)} .card.yellow .n{color:var(--yellow)} .card.green .n{color:var(--green)}
h2{font-size:16px;margin:24px 0 12px;border-right:3px solid var(--gold);padding-right:10px;color:var(--navy)}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.imp-box{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px}
.imp-box h3{margin:0 0 6px;font-size:14px;color:var(--navy)}
.imp-box p{color:var(--muted);font-size:11.5px;line-height:1.7;margin:0 0 10px}
.imp-box input[type=file]{width:100%;color:var(--muted);font-size:12px}
.imp-box .status{font-size:11.5px;margin-top:8px;color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--surface)}
tr:hover td{background:var(--surface2)}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:520px}
.badge{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
.badge.red{background:rgba(220,38,38,.12);color:var(--red)}
.badge.orange{background:rgba(245,158,11,.14);color:var(--orange)}
.badge.yellow{background:rgba(202,154,5,.14);color:var(--yellow)}
.badge.green{background:rgba(22,163,74,.12);color:var(--green)}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-family:inherit;font-size:12.5px}
.filter-chip{background:var(--surface2);border:1px solid var(--gold);color:var(--gold-d);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.dropdown-wrap{position:relative;display:inline-block}
.dropdown-toggle{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-family:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dropdown-toggle:hover{border-color:var(--gold)}
.dropdown-panel{position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:210px;max-height:230px;overflow:auto;z-index:20;box-shadow:0 4px 14px rgba(11,31,61,.15)}
.dropdown-panel label{display:flex;align-items:center;gap:6px;padding:6px 6px;font-size:12.5px;cursor:pointer;white-space:nowrap;border-radius:6px}
.dropdown-panel label:hover{background:var(--surface2)}
.dropdown-panel .dd-clear{display:block;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid var(--line);color:var(--gold-d);font-size:12px;padding:6px;cursor:pointer;margin-bottom:4px;font-family:inherit}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:13px}
.btn{background:var(--gold);border:none;color:var(--navy);font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px}
.btn:hover{background:var(--gold-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-d)}
.btn.ghost:disabled{opacity:.35}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px;border-top:1px solid var(--line)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:20px 0}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.chart-card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.mg-seg{transition:stroke-width .15s,opacity .15s}.mg-seg:hover{stroke-width:32}.legend-item[onclick]{cursor:pointer}.legend-item[onclick]:hover{color:var(--gold-d)}
.mg-tools{display:flex;gap:6px;margin-top:10px}.mg-tools .btn{padding:3px 10px;font-size:11px}
.hbar{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
.hbar:hover{background:var(--surface2)}
.hbar-label{width:112px;font-size:12px;text-align:left;flex-shrink:0}
.hbar-track{flex:1;height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar-fill{display:block;height:100%;border-radius:6px}
.hbar-val{width:56px;font-size:12px;font-weight:700;text-align:left}
.donut-seg{transition:stroke-width .15s}
.donut-seg:hover{stroke-width:31}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer;padding:2px 4px;border-radius:4px}
.legend-item:hover{background:var(--surface2)}
.ui-overlay{position:fixed;inset:0;background:rgba(11,31,61,.55);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.ui-dialog{background:var(--bg);border-radius:12px;max-width:460px;width:100%;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);border-top:4px solid var(--gold)}
.ui-msg{white-space:pre-line;font-size:14px;line-height:1.9;color:var(--text);margin-bottom:16px;max-height:60vh;overflow:auto}
.ui-actions{display:flex;gap:8px}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#B91C1C}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;width:100%;max-width:340px}
.login-box .logo{display:flex;justify-content:center;margin-bottom:14px}
.login-box h2{border:none;padding:0;margin:0 0 4px;font-size:18px;text-align:center;color:var(--navy)}
.login-box .hint{color:var(--muted);font-size:12px;margin-bottom:18px;text-align:center}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:10px}
.login-box .btn{width:100%;padding:10px;font-size:13px}
.login-box .err{color:var(--red);font-size:12px;margin-bottom:8px;min-height:14px;text-align:center}
.login-box .switch{color:var(--gold-d);font-size:12px;text-align:center;margin-top:12px;cursor:pointer}
</style>
</head>
<body>

<div id="login-screen"></div>

<div id="app-root" style="display:none">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="9" fill="#C9A876"/><path d="M20 7l10 5.5v11L20 29l-10-5.5v-11L20 7z" stroke="#0B1F3D" stroke-width="1.6"/><path d="M10 12.5L20 18l10-5.5M20 18v11" stroke="#0B1F3D" stroke-width="1.6"/><circle cx="27" cy="13" r="4.2" fill="#FAF7EF" stroke="#0B1F3D" stroke-width="1.6"/><line x1="30.1" y1="16.1" x2="32.5" y2="18.5" stroke="#0B1F3D" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div><h1>نظام مراقبة المخزون</h1><div class="sub">تدوير · إرجاع · تصريف · شراء</div><div class="sub" style="color:var(--gold);font-weight:600">المطور: باسم الحذيفي</div></div>
  </div>
  <div class="right">
    <span id="whoami" style="color:var(--gold);font-size:12.5px;font-weight:600"></span>
    <button class="btn ghost" id="btn-reset" onclick="resetAll()">مسح كل البيانات</button>
    <button class="btn ghost" onclick="logout()">تسجيل خروج</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>البيانات تُحفظ محليًا في هذا المتصفح فقط (سعة كبيرة تكفي مئات الآلاف من الأسطر) — لا مزامنة ولا سحابة. فتح النظام من متصفح أو جهاز آخر يعطيك بيانات فارغة لأنها غير مشتركة.</footer>
</div>

<script>
// ================= IN-PAGE DIALOGS =================
// This page runs inside a sandboxed frame where the browser's own alert()/confirm() boxes can be blocked:
// confirm() then silently returns "false" without showing anything, which made delete buttons look dead and hid
// every alert message. These dialogs are drawn by the page itself, so they always appear.
function uiDialog(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.createElement('div'); overlay.className = 'ui-overlay';
    const box = document.createElement('div'); box.className = 'ui-dialog';
    box.setAttribute('role', opts.confirm ? 'alertdialog' : 'dialog');
    const msg = document.createElement('div'); msg.className = 'ui-msg'; msg.textContent = String(message);
    const row = document.createElement('div'); row.className = 'ui-actions';
    const ok = document.createElement('button'); ok.type = 'button';
    ok.className = 'btn' + (opts.danger ? ' danger' : ''); ok.textContent = opts.okText || 'موافق';
    let cancel = null;
    if(opts.confirm){
      cancel = document.createElement('button'); cancel.type = 'button';
      cancel.className = 'btn ghost'; cancel.textContent = opts.cancelText || 'إلغاء';
    }
    const done = v=>{ document.removeEventListener('keydown', onKey, true); overlay.remove(); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(opts.confirm ? false : true); } };
    ok.addEventListener('click', ()=>done(true));
    if(cancel) cancel.addEventListener('click', ()=>done(false));
    document.addEventListener('keydown', onKey, true);
    row.appendChild(ok); if(cancel) row.appendChild(cancel);
    box.appendChild(msg); box.appendChild(row); overlay.appendChild(box); document.body.appendChild(overlay);
    (opts.danger && cancel ? cancel : ok).focus();   // destructive confirms default to "cancel"
  });
}
function uiConfirm(message, opts){ return uiDialog(message, Object.assign({confirm:true, okText:'تأكيد'}, opts||{})); }
function uiAlert(message){ return uiDialog(message, {confirm:false}); }
window.alert = function(message){ uiAlert(message); };   // every existing alert(...) now uses the in-page dialog

// ================= AUTH =================
function renderLogin(){
  const raw = localStorage.getItem('inv_auth');
  const box = document.getElementById('login-screen');
  const logo = `<div class="logo"><svg width="52" height="52" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="9" fill="#C9A876"/><path d="M20 7l10 5.5v11L20 29l-10-5.5v-11L20 7z" stroke="#0B1F3D" stroke-width="1.6"/><path d="M10 12.5L20 18l10-5.5M20 18v11" stroke="#0B1F3D" stroke-width="1.6"/><circle cx="27" cy="13" r="4.2" fill="#FAF7EF" stroke="#0B1F3D" stroke-width="1.6"/><line x1="30.1" y1="16.1" x2="32.5" y2="18.5" stroke="#0B1F3D" stroke-width="1.8" stroke-linecap="round"/></svg></div>`;
  if(!raw){
    box.innerHTML = `<div class="login-box">${logo}
      <h2>إنشاء حساب الدخول</h2>
      <div class="hint">أول استخدام للنظام — أنشئ اسم مستخدم وكلمة مرور خاصة بك (تُحفظ في هذا المتصفح فقط).</div>
      <div class="err" id="auth-err"></div>
      <input id="su-user" placeholder="اسم المستخدم">
      <input id="su-pass" type="password" placeholder="كلمة المرور">
      <input id="su-pass2" type="password" placeholder="تأكيد كلمة المرور">
      <button class="btn" onclick="doSignup()">إنشاء الحساب والدخول</button>
    </div>`;
  }else{
    box.innerHTML = `<div class="login-box">${logo}
      <h2>تسجيل الدخول</h2>
      <div class="hint">نظام مراقبة المخزون<br><span style="color:var(--gold-d);font-weight:600">المطور: باسم الحذيفي</span></div>
      <div class="err" id="auth-err"></div>
      <input id="li-user" placeholder="اسم المستخدم">
      <input id="li-pass" type="password" placeholder="كلمة المرور">
      <button class="btn" onclick="doLogin()">دخول</button>
      <div class="switch" id="reset-auth-link" style="display:none" onclick="resetAuthAccount()">نسيت البيانات؟ إعادة إنشاء حساب</div>
    </div>`;
    // the "recreate owner account" link is offered only while no extra users exist (otherwise a restricted user could take over the owner account)
    idbGet('users').then(u=>{ const el=document.getElementById('reset-auth-link'); if(el && !(u&&u.length)) el.style.display=''; }).catch(()=>{ const el=document.getElementById('reset-auth-link'); if(el) el.style.display=''; });
  }
}
async function resetAuthAccount(){
  if(await uiConfirm('سيتم حذف حساب الدخول الحالي وإنشاء حساب جديد. متابعة؟', {danger:true, okText:'نعم، أنشئ حسابًا جديدًا'})){
    localStorage.removeItem('inv_auth'); renderLogin();
  }
}
function doSignup(){
  const u = document.getElementById('su-user').value.trim();
  const p = document.getElementById('su-pass').value;
  const p2 = document.getElementById('su-pass2').value;
  if(!u || !p){ document.getElementById('auth-err').textContent='الرجاء تعبئة جميع الحقول'; return; }
  if(p!==p2){ document.getElementById('auth-err').textContent='كلمتا المرور غير متطابقتين'; return; }
  localStorage.setItem('inv_auth', JSON.stringify({u, p:btoa(unescape(encodeURIComponent(p)))}));
  sessionStorage.setItem('inv_session','1'); sessionStorage.setItem('inv_user','owner');
  boot();
}
async function doLogin(){
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const err = document.getElementById('auth-err');
  const auth = JSON.parse(localStorage.getItem('inv_auth')||'{}');
  if(u===auth.u && btoa(unescape(encodeURIComponent(p)))===auth.p){
    sessionStorage.setItem('inv_session','1'); sessionStorage.setItem('inv_user','owner'); boot(); return;
  }
  try{
    const users = await idbGet('users') || [];
    const m = users.find(x=>x.active!==false && String(x.username||'').toLowerCase()===u.toLowerCase());
    if(m && await pwHash(m.salt, p)===m.hash){
      sessionStorage.setItem('inv_session','1'); sessionStorage.setItem('inv_user', m.id); boot(); return;
    }
  }catch(e){}
  err.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';
}
function logout(){ sessionStorage.removeItem('inv_session'); sessionStorage.removeItem('inv_user'); curUser=null; boot(); }
async function boot(){
  const logged = sessionStorage.getItem('inv_session')==='1';
  document.getElementById('login-screen').style.display = logged? 'none':'flex';
  document.getElementById('app-root').style.display = logged? 'block':'none';
  if(logged){
    await loadDB();
    if(!resolveCurrentUser()){ sessionStorage.removeItem('inv_session'); sessionStorage.removeItem('inv_user'); boot(); return; }
    installPermGuards();
    if(!can(activeTab,'v')) activeTab = firstViewableTab();
    render();
  } else { renderLogin(); }
}

// ================= STATE =================
const STORES = ['items','suppliers','branches','branch','sales','expiry','central','transfers','monthlySales','purchases','promoItems','autoThresholds','stopped','limParams','expRot','invList','users'];
const BACKUP_STORES = STORES.filter(k=>k!=='users');   // the user accounts are never part of a data backup
let DB = {items:[],suppliers:[],branches:[],branch:[],sales:[],expiry:[],central:[],transfers:[],monthlySales:[],purchases:[],promoItems:[],autoThresholds:[],stopped:[],limParams:[],expRot:[],invList:[],users:[]};
function branchNameMap(){ return new Map(DB.branches.map(b=>[b.code,b.name])); }

// ---- Storage: IndexedDB, entirely local to this browser, no network/sync involved ----
// Chosen deliberately over localStorage (which caps out around 5-10MB total, nowhere
// near enough for 300k+ rows) and over the earlier cloud "db" capability approach (which
// turned out to have a real race-condition bug when saves overlapped, plus document-size
// and per-collection query limits that kept rejecting large batches). IndexedDB has no
// such per-record size cap (browser storage quota is typically hundreds of MB to several
// GB) and each store here holds its whole array as one record via the structured clone
// algorithm - simple, fast, and with nothing to race against since there is no
// background sync running concurrently.
const IDB_NAME = 'inv_local_db';
// IMPORTANT: bump this every time a new name is added to STORES above. IndexedDB only
// runs onupgradeneeded (which creates missing object stores) when this version number
// increases — it will NOT re-run just because the code changed. Forgetting to bump it
// is exactly why "مبيعات الفروع حسب كل شهر" and "مشتريات الأصناف" appeared to lose data:
// their object stores were never created in browsers that had already opened the
// database at version 1, so every save/read against them silently failed. The upgrade
// handler below only ever ADDS missing stores — it never deletes anything — so bumping
// this is always safe for existing data in every other store.
// v3 adds 'promoItems' (promotional-sales item list); v4 adds 'autoThresholds' (best-seller thresholds per branch).
// v5 adds 'stopped' (items whose purchasing was discontinued).
// v6 adds 'limParams' (no longer used by any feature, but KEPT: browsers that already upgraded to v6 would fail to open the database if the version went back down).
// v7 adds 'expRot' (executed near-expiry rotation operations).
// v8 adds 'invList' (item numbers / barcodes imported into the stock-movement analysis page).
// v9 adds 'users' (extra user accounts and their page permissions).
const IDB_VERSION = 9;
let idbPromise = null;
function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      for(const s of STORES){ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s); }
    };
    req.onsuccess = e=> resolve(e.target.result);
    req.onerror = e=> reject(e.target.error);
  });
  return idbPromise;
}
async function idbGet(storeName){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get('data');
    req.onsuccess = ()=> resolve(Array.isArray(req.result) ? req.result : []);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(storeName, value){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value, 'data');
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbClear(storeName){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadDB(){
  for(const k of STORES){
    try{ DB[k] = await idbGet(k); }catch(e){ DB[k] = []; }
  }
}
async function saveDB(k){
  if(typeof canSaveStore==='function' && !canSaveStore(k)){ console.warn('save blocked by permissions:', k); return false; }
  _expCache = null;          // derived near-expiry analysis is rebuilt after any data change
  try{ await idbSet(k, DB[k]); return true; }
  catch(e){ console.error('idb save failed for', k, e); return false; }
}
async function resetAll(){

// generic search+filter+pagination state per tab
const PAGE_SIZE = 200;
let pageState = {};
function ps(tab){ if(!pageState[tab]) pageState[tab] = {q:''}; return pageState[tab]; }
function setQ(tab, val){ ps(tab).q = val; ps(tab).page = 1; render(); }
function setFilterField(tab, field, val){ ps(tab)[field] = val; ps(tab).page = 1; render(); }
function goPage(tab, p){ ps(tab).page = p; render(); }

function goFilter(tab, field, value){ const st=ps(tab); st[field]=value; st.page=1; activeTab=tab; render(); }

function applySearch(rows, fields, q){
  if(!q) return rows;
  const s = q.trim().toLowerCase();
  return rows.filter(r => fields.some(f => String(r[f]||'').toLowerCase().includes(s)));
}
function paginate(rows, tab){
  const st = ps(tab);
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  st.page = Math.min(Math.max(1, st.page||1), totalPages);
  return {rows: rows.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE), total, totalPages, page: st.page};
}

// ---------- Excel parsing helpers ----------
function readSheetRows(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      cb(rows.slice(1));
    }catch(err){ alert('تعذر قراءة الملف: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function readSheetRowsWithHeader(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      cb(rows[0]||[], rows.slice(1));
    }catch(err){ alert('تعذر قراءة الملف: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function toISODate(v){
  if(v instanceof Date && !isNaN(v.getTime())){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }
  if(typeof v === 'number' && window.XLSX && XLSX.SSF){
    try{
      const d = XLSX.SSF.parse_date_code(v);
      if(d && d.y) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
    }catch(e){}
  }
  return String(v||'').trim();
}

// ---------- Analysis engine ----------
function daysRemaining(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(dateStr); exp.setHours(0,0,0,0);
  if(isNaN(exp.getTime())) return null;
  return Math.round((exp - today)/86400000);
}
function latestBranchInv(){
  const map = new Map();
  for(const r of DB.branch){
    const key = r.itemCode+'|'+r.branch;
    const prev = map.get(key);
    if(!prev || r.date > prev.date) map.set(key, r);
  }
  return Array.from(map.values());
}
function salesByItem(){
  const map = new Map();
  for(const s of DB.sales) map.set(s.itemCode, (map.get(s.itemCode)||0) + s.avgMonthly);
  return map;
}
function salesByItemBranch(){
  const map = new Map();
  for(const s of DB.sales){
    const key = s.itemCode+'|'+s.branch;
    map.set(key, (map.get(key)||0) + s.avgMonthly);
  }
  return map;
}
function classify(avgMonthly){
  if(avgMonthly<=0) return {label:'راكد', cls:'red'};
  if(avgMonthly<3) return {label:'بطيء', cls:'orange'};
  if(avgMonthly<15) return {label:'متوسط', cls:'yellow'};
  return {label:'سريع', cls:'green'};
}
// ---- Item movement type: computed from the average monthly sales (all branches combined) ----
// Re-evaluated on every render from the current sales data, so it updates automatically
// whenever sales are imported/updated.
const MOVEMENT_TYPES = [
  {label:'Fast Moving A+', min:1000,      color:'#14532D'},
  {label:'Fast Moving A',  min:500,       color:'#16A34A'},
  {label:'Fast Moving B',  min:100,       color:'#84CC16'},
  {label:'Fast Moving C',  min:50,        color:'#EAB308'},
  {label:'Moving',         min:15,        color:'#FB923C'},   // 15 – 49
  {label:'Slow Moving',    min:5,         color:'#EA580C'},   //  5 – 14
  {label:'No Moving',      min:1,         color:'#DC2626'},   //  1 – 4
  {label:'Inactive',       min:-Infinity, color:'#7F1D1D'},   // less than 1 (including 0)
];
function movementType(avg){
  for(const t of MOVEMENT_TYPES){ if(avg >= t.min) return t.label; }
  return 'Inactive';
}
function movementColor(label){
  const t = MOVEMENT_TYPES.find(x=>x.label===label);
  return t? t.color : '#6B7280';
}
function movementBadge(label){
  const c = movementColor(label);
  return `<span dir="ltr" style="display:inline-flex;align-items:center;gap:5px;background:${c}22;border:1px solid ${c}66;color:#16233A;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block"></span>${label}</span>`;
}
// Average monthly sales per item = total units sold across ALL branches ÷ number of months,
// over the months shown on the "مبيعات الفروع حسب كل شهر" page (up to the last 12 imported).
// If no monthly sales were imported yet, falls back to the older average-only sales import.
function itemAvgMonthlyMap(){
  const months = monthlySalesMonths();
  if(months.length===0) return salesByItem();
  const set = new Set(months);
  const map = new Map();
  for(const r of DB.monthlySales){
    if(set.has(r.month)) map.set(r.itemCode, (map.get(r.itemCode)||0) + r.qty);
  }
  for(const [k,v] of map) map.set(k, v/months.length);
  return map;
}
function itemAnalysis(){
  const avgMap = itemAvgMonthlyMap();
  const inv = latestBranchInv();
  const qtyByItem = new Map();
  for(const r of inv) qtyByItem.set(r.itemCode, (qtyByItem.get(r.itemCode)||0)+r.qty);
  const centralMap = centralStockByItem();
  return DB.items.map(it=>{
    const avgMonthly = avgMap.get(it.code) || 0;
    const branchQty = qtyByItem.get(it.code) || 0;
    const centralQty = centralMap.get(it.code) || 0;
    // qty is the TOTAL stock: branches + central warehouses
    return {...it, branchQty, centralQty, qty: branchQty + centralQty, avgMonthly, movement: movementType(avgMonthly)};
  });
}
function deadStockReport(){
  const sIB = salesByItemBranch();
  const inv = latestBranchInv();
  const groups = new Map();
  for(const r of inv){
    if(r.qty<=0) continue;
    const avg = sIB.get(r.itemCode+'|'+r.branch) || 0;
    if(avg<=0){
      if(!groups.has(r.itemCode)) groups.set(r.itemCode, {branches:0, qty:0});
      const g = groups.get(r.itemCode); g.branches++; g.qty += r.qty;
    }
  }
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const supMap = new Map(DB.suppliers.map(s=>[s.name,s]));
  const rows = [];
  for(const [code, g] of groups){
    const it = itemsMap.get(code); if(!it) continue;
    const sup = supMap.get(it.supplier);
    rows.push({ code, name:it.name, supplier:it.supplier, branches:g.branches, qty:g.qty,
      cost:it.cost, value: g.qty*it.cost, returnable: sup? sup.returnable : it.returnable });
  }
  return rows.sort((a,b)=>b.value-a.value);
}
// ---- New ratio-based dead-stock analysis, driven by the "مبيعات الفروع حسب كل شهر" page ----
// Definition: an item is stagnant when (total units sold in the selected last-N months,
// across all branches) ÷ (total stock currently sitting in branches + central warehouses)
// falls below the chosen percentage threshold. This is deliberately item-level (summed
// across branches+warehouses), not per-branch, since the question here is "should this
// item be returned to its supplier at all" rather than "is one branch slow".
// Stock per item, split into the branches' part and the central warehouses' part.
function itemStockParts(){
  const branch = new Map(), central = new Map();
  for(const r of latestBranchInv()) branch.set(r.itemCode, (branch.get(r.itemCode)||0) + r.qty);
  for(const r of DB.central) central.set(r.itemCode, (central.get(r.itemCode)||0) + r.qty);
  return {branch, central};
}
// Total stock = branches + central warehouses.
function itemStockTotals(parts){
  parts = parts || itemStockParts();
  const map = new Map(parts.branch);
  for(const [code, q] of parts.central) map.set(code, (map.get(code)||0) + q);
  return map;
}
function stockCell(total, branchQty, centralQty){
  return `${total.toLocaleString()}<div style="color:var(--muted);font-size:10.5px;white-space:nowrap">فروع ${branchQty.toLocaleString()} + مخازن ${centralQty.toLocaleString()}</div>`;
}
function itemSalesTotals(months){
  const set = new Set(months);
  const map = new Map();
  for(const r of DB.monthlySales){ if(set.has(r.month)) map.set(r.itemCode, (map.get(r.itemCode)||0) + r.qty); }
  return map;
}
// Items first bought within the last N months (no purchase before that window): recent arrivals, not "dead".
function newPurchasedInfo(){
  const st = ps('dead');
  const N = Math.max(1, Math.min(12, parseInt(st.newMonths,10) || 3));
  const d = new Date(); d.setMonth(d.getMonth()-N);
  const cutoff = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const m = new Map();
  for(const r of DB.purchases){
    if(!r.date) continue;
    let x = m.get(r.itemCode); if(!x){ x = {first:r.date, last:r.date, qty:0, older:false}; m.set(r.itemCode, x); }
    if(r.date < x.first) x.first = r.date;
    if(r.date > x.last) x.last = r.date;
    if(r.date < cutoff) x.older = true; else x.qty += Number(r.qty)||0;
  }
  const set = new Map();
  for(const [code,x] of m) if(!x.older && x.last >= cutoff) set.set(code, x);
  return {N, cutoff, map:set};
}
function newPurchasedRows(){
  const info = newPurchasedInfo();
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const parts = itemStockParts(), stockMap = itemStockTotals(parts), avgMap = itemAvgMonthlyMap();
  const n = Math.max(1, Math.min(12, parseInt(ps('dead').months,10) || 3));
  const salesMap = itemSalesTotals(monthlySalesMonths().slice(-n));
  const rows = [];
  for(const [code,x] of info.map){
    const it = itemsMap.get(code); if(!it) continue;
    rows.push({code, name:it.name, group:it.group||'', supplier:it.supplier||'', first:x.first, month:x.first.slice(0,7), last:x.last, qtyBought:x.qty,
      stock: stockMap.get(code)||0, branchStock: parts.branch.get(code)||0, centralStock: parts.central.get(code)||0,
      sales: salesMap.get(code)||0, movement: movementType(avgMap.get(code)||0)});
  }
  rows.sort((a,b)=> a.first<b.first?1:a.first>b.first?-1:0);
  return {rows, N:info.N, cutoff:info.cutoff};
}
function newPurchasedFiltered(){
  const st = ps('dead'); const r = newPurchasedRows();
  let rows = applySearch(r.rows, ['code','name','supplier','group'], st.q);
  if(st.newMonthFilter) rows = rows.filter(x=>x.month===st.newMonthFilter);
  return {rows, all:r.rows, N:r.N, cutoff:r.cutoff};
}
async function exportDeadNew(){
  const {rows} = newPurchasedFiltered();
  await exportRowsExcel(rows.map(r=>({'رقم الصنف':r.code,'الاسم':r.name,'المجموعة':r.group,'المورد':r.supplier,'نوع الحركة':r.movement,'أول شراء':r.first,'آخر شراء':r.last,'الكمية المشتراة (الفترة)':r.qtyBought,'إجمالي المخزون':r.stock,'مخزون الفروع':r.branchStock,'مخزون المخازن الرئيسية':r.centralStock,'المبيعات (آخر أشهر التحليل)':r.sales})), 'الأصناف_الجديدة_المشتراة_حديثا');
}
function setDeadView(v){ ps('dead').view = v; ps('dead').page = 1; render(); }
function deadStockReportV2(opts){
  const ignore = !!(opts && opts.ignoreFilters);   // used to export hand-picked items regardless of the current filters
  const st = ps('dead');
  const n = Math.max(1, Math.min(12, parseInt(st.months,10) || 3));
  const thresholdPct = st.thresholdPct!=null && st.thresholdPct!=='' ? parseFloat(st.thresholdPct) : 10;
  if(DB.monthlySales.length===0) return {rows:[], months:[], n, thresholdPct};
  const months = monthlySalesMonths().slice(-n);
  const parts = itemStockParts();
  const stockMap = itemStockTotals(parts);
  const salesMap = itemSalesTotals(months);
  const lastPurchase = lastPurchaseByItem();
  const avgMap = itemAvgMonthlyMap();
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const supMap = new Map(DB.suppliers.map(s=>[s.name,s]));
  const newMap = newPurchasedInfo().map;
  let excludedNew = 0;
  const rows = [];
  for(const [code, stock] of stockMap){
    if(stock<=0) continue;
    const sales = salesMap.get(code) || 0;
    const pct = (sales/stock)*100;
    if(pct >= thresholdPct) continue;
    if(newMap.has(code)){ excludedNew++; continue; }
    const it = itemsMap.get(code); if(!it) continue;
    const sup = supMap.get(it.supplier);
    const returnable = sup? sup.returnable : it.returnable;
    if(!ignore){
      if(st.returnable==='yes' && !returnable) continue;
      if(st.returnable==='no' && returnable) continue;
      if(st.supplier && it.supplier!==st.supplier) continue;
    }
    rows.push({ code, name:it.name, supplier:it.supplier, stock, sales, pct:+pct.toFixed(2),
      value: Math.round(stock*it.cost*100)/100, returnable, lastPurchase: lastPurchase.get(code) || '',
      movement: movementType(avgMap.get(code) || 0),
      branchStock: parts.branch.get(code) || 0, centralStock: parts.central.get(code) || 0 });
  }
  rows.sort((a,b)=>a.pct-b.pct);
  return {rows, months, n, thresholdPct, excludedNew};
}
// Cost of a branch-stock row = the item's cost from the items file (so stock files need no cost column);
// the cost stored on the stock row is only a fallback for items without a cost.
function stockCostOf(costMap){ return r=>{ const c = costMap.get(r.itemCode); return c>0 ? c : (Number(r.cost)||0); }; }
function branchSummary(){
  const inv = latestBranchInv();
  const unitCost = stockCostOf(new Map(DB.items.map(i=>[i.code, Number(i.cost)||0])));
  const map = new Map();
  for(const b of DB.branches) map.set(b.code, {code:b.code, name:b.name, qty:0, value:0, items:new Set(), sales:0});
  for(const r of inv){
    if(!map.has(r.branch)) map.set(r.branch, {code:r.branch, name:'(غير مسجل)', qty:0, value:0, items:new Set(), sales:0});
    const g = map.get(r.branch); g.qty += r.qty; g.value += r.qty*unitCost(r); g.items.add(r.itemCode);
  }
  for(const s of DB.sales){
    if(!map.has(s.branch)) map.set(s.branch, {code:s.branch, name:'(غير مسجل)', qty:0, value:0, items:new Set(), sales:0});
    map.get(s.branch).sales += s.avgMonthly;
  }
  return Array.from(map.values()).map(g=>({...g, itemCount:g.items.size, avgMonthlySales:g.sales}));
}
function centralStockByItem(){
  const map = new Map();
  for(const r of DB.central) map.set(r.itemCode, (map.get(r.itemCode)||0) + r.qty);
  return map;
}
// ---- Minimum transfer size by item group ----
// Medicines, special items and electrical-care items may be transferred from 1 unit up (as the sales analysis
// calls for). Every other group is never transferred in less than 3 units, even if the destination branch only
// sells 1–2 per month; above that the quantity follows the destination's monthly sales.
// Group names are matched by keyword after normalising Arabic spelling (hamza/ta marbuta/diacritics), so
// "الأدوية" / "ادوية", "الأصناف الخاصة", "العناية الكهربائية" are recognised however they are typed.
function normAr(x){
  return String(x||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
}
function isLowMinGroup(group){
  const g = normAr(group);
  if(!g) return false;
  if(g.includes('ادويه') || g.includes('دواء')) return true;      // الأدوية
  if((g.includes('صناف') || g.includes('صنف')) && g.includes('خاص')) return true;   // الأصناف الخاصة (جمع «أصناف» أو مفرد «صنف»)
  if(g.includes('كهرب') && g.includes('عنا')) return true;         // العناية الكهربائية
  return false;
}
function minTransferQty(group){ return isLowMinGroup(group) ? 1 : 3; }
// A branch that gives stock away must keep enough for this many months of its OWN sales; only what is above
// that is offered to branches that need it.
const SOURCE_KEEP_MONTHS = 2;
function rotationSuggestions(){
  const sIB = salesByItemBranch();
  const groupByCode = new Map(DB.items.map(i=>[i.code, i.group]));
  const inv = latestBranchInv();
  const central = centralStockByItem();
  const byItem = new Map();
  for(const r of inv){
    if(!byItem.has(r.itemCode)) byItem.set(r.itemCode, []);
    byItem.get(r.itemCode).push(r);
  }
  const out = [];
  let skippedForCentral = 0;
  for(const [code, rows] of byItem){
    if((central.get(code)||0) > 0){ skippedForCentral++; continue; } // available centrally — no need to shuffle between branches
    const minQty = minTransferQty(groupByCode.get(code));
    const withNeed = rows.map(r=>{
      const avg = sIB.get(r.itemCode+'|'+r.branch) || 0;
      // diff = what this branch could give away while still keeping SOURCE_KEEP_MONTHS months of its own sales
      return {...r, avg, diff: r.qty - avg*SOURCE_KEEP_MONTHS};
    });
    const sources = withNeed.filter(r=>r.avg>0 && r.diff >= 1).sort((a,b)=>b.diff-a.diff);
    const needs = withNeed.filter(r=>r.avg>0 && r.qty < r.avg*0.5).sort((a,b)=>(a.qty-a.avg)-(b.qty-b.avg));
    for(const need of needs){
      for(const src of sources){
        if(src.branch===need.branch) continue;
        const surplusQty = Math.floor(src.diff);
        const needQty = Math.ceil(need.avg - need.qty);
        if(surplusQty>0 && needQty>0){
          // never ship less than this group's minimum, even if sales only call for 1–2 units
          const moveQty = Math.min(surplusQty, Math.max(needQty, minQty));
          if(moveQty < minQty) continue; // this source cannot supply the minimum
          let priority = 'yellow', priorityLabel='متوسطة';
          if(need.qty<=0){priority='red'; priorityLabel='عاجلة';}
          else if(need.qty < need.avg*0.25){priority='orange'; priorityLabel='عالية';}
          out.push({code, from:src.branch, to:need.branch, qty:moveQty, priority, priorityLabel,
            fromStock: src.qty, toStock: need.qty});
          src.diff -= moveQty; need.qty += moveQty;
        }
      }
    }
  }
  rotationSuggestions.lastSkippedForCentral = skippedForCentral;
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const bMap = branchNameMap();
  return out.map(o=>({...o, name:(itemsMap.get(o.code)||{}).name||o.code,
      fromName: bMap.get(o.from)||'', toName: bMap.get(o.to)||''}))
    .sort((a,b)=>({red:0,orange:1,yellow:2}[a.priority]-{red:0,orange:1,yellow:2}[b.priority]));
}
let _expCache = null;
function expiryAnalysis(){
  const key = [DB.expiry, DB.sales, DB.items, DB.suppliers, DB.branches];
  if(_expCache && _expCache.k.every((x,i)=>x===key[i]) && _expCache.n===DB.expiry.length+':'+DB.sales.length+':'+DB.items.length) return _expCache.v;
  const v = _expiryAnalysisCompute();
  _expCache = {k:key, n:DB.expiry.length+':'+DB.sales.length+':'+DB.items.length, v};
  return v;
}
function _expiryAnalysisCompute(){
  const sIB = salesByItemBranch();
  // best two selling branches per item (replaces a full scan of every item-branch pair for each batch)
  const top = new Map();
  for(const [key,a] of sIB){
    if(!(a>0)) continue;
    const i = key.lastIndexOf('|'), ic = key.slice(0,i), br = key.slice(i+1);
    let t = top.get(ic); if(!t){ t = {b1:null,b2:null}; top.set(ic,t); }
    if(!t.b1 || a>t.b1.avg){ t.b2 = t.b1; t.b1 = {branch:br, avg:a}; }
    else if(!t.b2 || a>t.b2.avg) t.b2 = {branch:br, avg:a};
  }
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const supMap = new Map(DB.suppliers.map(s=>[s.name,s]));
  const bMap = branchNameMap();
  return DB.expiry.map(r=>{
    const it = itemsMap.get(r.itemCode) || {};
    const sup = supMap.get(it.supplier);
    const returnable = sup? sup.returnable : !!it.returnable;
    const days = daysRemaining(r.expiryDate);
    const avg = sIB.get(r.itemCode+'|'+r.branch) || 0;
    const expectedSold = (days!=null && days>0)? avg*(days/30) : 0;
    const atRisk = Math.max(0, r.qty - expectedSold);
    const urgency = days==null? 'orange' : days<=30?'red': days<=60?'orange': days<=90?'yellow':'green';
    let action='ok', actionLabel='سيُباع قبل الانتهاء', target=null;
    if(atRisk>0){
      if(returnable){ action='return'; actionLabel='يُرجع للمورد ('+(it.supplier||'—')+')'; }
      else{
        const t = top.get(r.itemCode);
        const best = t ? (t.b1 && t.b1.branch!==r.branch ? t.b1 : (t.b2 && t.b2.branch!==r.branch ? t.b2 : null)) : null;
        if(best){ action='rotate'; target=best.branch; actionLabel='تدوير إلى فرع '+best.branch+(bMap.get(best.branch)?' — '+bMap.get(best.branch):''); }
        else{ action='promo'; actionLabel='🟡 عرض ترويجي للتصريف'; }
      }
    }
    return {...r, name:it.name||r.itemCode, group:it.group||'', supplier:it.supplier||'', barcode:it.barcode||'', returnable:!!returnable, cost:it.cost||0, value:atRisk*(it.cost||0),
      days, avg, expectedSold, atRisk, urgency, action, actionLabel, branchName: bMap.get(r.branch)||''};
  }).sort((a,b)=>(a.days??9999)-(b.days??9999));
}

// Dependency-free inline SVG charts — no external library, so there is nothing that
// can fail to load from a blocked/slow network. Pure functions returning SVG markup.
function svgDonut(labels, values, colors, size, onclicks, centerText){
  size = size || 180;
  const total = values.reduce((a,b)=>a+b,0);
  const r = size/2 - 14, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  if(total<=0) return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="180"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E3E2D9" stroke-width="24"/></svg>`;
  let offset = 0;
  const segs = values.map((v,i)=>{
    const frac = v/total;
    const dash = Math.max(frac*circ - (frac>0?1:0), 0);
    const click = onclicks && onclicks[i] ? ` onclick="${onclicks[i]}" style="cursor:pointer"` : '';
    const seg = `<circle class="donut-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="24" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"${click}><title>${labels[i]}: ${v.toLocaleString()} (${(frac*100).toFixed(1)}%)</title></circle>`;
    offset += frac*circ;
    return seg;
  }).join('');
  const center = centerText!=null ? `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F3D">${centerText}</text><text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="11" fill="#6B7280">صنف</text>` : '';
  const legend = labels.map((l,i)=>{
    const pct = (values[i]/total*100).toFixed(1);
    const click = onclicks && onclicks[i] ? ` onclick="${onclicks[i]}"` : '';
    return `<div class="legend-item"${click}><span style="width:10px;height:10px;border-radius:3px;background:${colors[i]};display:inline-block"></span><span dir="ltr">${l}</span>: ${values[i].toLocaleString()} (${pct}%)</div>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" width="170" height="170">${segs}${center}</svg><div style="display:flex;flex-direction:column;gap:2px">${legend}</div></div>`;
}
function svgBars(labels, values, colors, width, height){
  width = width || 320; height = height || 190;
  const max = Math.max(...values, 1);
  const n = values.length;
  const slot = width/n, barW = slot*0.5;
  const chartH = height-36;
  const bars = values.map((v,i)=>{
    const h = max>0? (v/max)*chartH : 0;
    const x = i*slot + (slot-barW)/2;
    const y = height-26-h;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,0)}" fill="${colors[i]}" rx="4"/>
      <text x="${x+barW/2}" y="${height-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${labels[i]}</text>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#16233A">${v}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="190">${bars}</svg>`;
}

// ---------- Monthly branch sales (wide format: item, item name, branch, then one column per month) ----------
const ARABIC_MONTHS = {'يناير':'01','فبراير':'02','مارس':'03','أبريل':'04','ابريل':'04','مايو':'05','يونيو':'06',
  'يوليو':'07','أغسطس':'08','اغسطس':'08','سبتمبر':'09','أكتوبر':'10','اكتوبر':'10','نوفمبر':'11','ديسمبر':'12'};
function importMonthlySales(file){
  const yearInput = document.getElementById('monthly-sales-year');
  const year = yearInput ? yearInput.value.trim() : '';
  if(!/^\d{4}$/.test(year)){ alert('أدخل السنة (4 أرقام) في الحقل المجاور قبل رفع الملف — كل أعمدة الأشهر في هذا الملف ستُحسب على هذه السنة.'); return; }
  readSheetRowsWithHeader(file, async (header, rows)=>{
    // Columns: 0=رقم الصنف, 1=اسم الصنف, 2=الفرع ("كود - اسم"), 3.. = شهر لكل عمود (حتى 12)
    const monthCols = [];
    for(let i=3;i<header.length;i++){
      const num = ARABIC_MONTHS[String(header[i]||'').trim()];
      if(num) monthCols.push({idx:i, month: year+'-'+num});
    }
    if(monthCols.length===0){
      alert('لم يتم التعرف على أي عمود شهر في رأس الملف. تأكد أن الأعمدة من الرابع فصاعدًا بأسماء الأشهر بالعربي (يناير، فبراير...).');
      return;
    }
    const parsed = [];
    for(const r of rows){
      const itemCode = String(r[0]||'').trim();
      if(!itemCode) continue;
      const itemName = String(r[1]||'').trim();
      const branchCode = String(r[2]||'').trim();
      for(const mc of monthCols){
        parsed.push({itemCode, itemName, branch:branchCode, month:mc.month, qty:Number(r[mc.idx])||0});
      }
    }
    // Upsert per month: replace only the months this file covers, leave every other
    // month already stored untouched — this is what lets you add one or more months at
    // a time (at the start of a new month, or a whole year at once) without losing data.
    const monthsTouched = new Set(monthCols.map(m=>m.month));
    DB.monthlySales = DB.monthlySales.filter(x=>!monthsTouched.has(x.month)).concat(parsed);
    setStatus('st-monthlysales', 'جاري الحفظ...');
    const ok = await saveDB('monthlySales');
    const monthsList = Array.from(monthsTouched).join('، ');
    setStatus('st-monthlysales', parsed.length.toLocaleString()+' سطر عبر '+monthCols.length+' شهر ('+monthsList+') — '+(ok?'✅ محفوظ في هذا المتصفح':'⚠️ فشل الحفظ'));
    render();
  });
}

function importPurchases(file){

      itemCode:String(r[0]), supplierCode:String(r[1]||''), date:toISODate(r[2]), qty:Number(r[3])||0

}

  return Array.from(new Set(DB.monthlySales.map(r=>r.month))).sort().slice(-12);

function monthlySalesPivotRows(){
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const bMap = branchNameMap();
  const months = monthlySalesMonths();
  const monthSet = new Set(months);
  const map = new Map();
  for(const r of DB.monthlySales){
    if(!monthSet.has(r.month)) continue;
    const k = r.itemCode+'|'+r.branch;
    if(!map.has(k)) map.set(k, {itemCode:r.itemCode, branch:r.branch, itemNameFile:r.itemName||'', m:{}});
    map.get(k).m[r.month] = (map.get(k).m[r.month]||0) + r.qty;
  }

function allTransferRowsWithGroup(){
  const itemsMap = new Map(DB.items.map(i=>[i.code,i]));
  const avgMap = itemAvgMonthlyMap();
  return rotationSuggestions().map(r=>({...r, movement: movementType(avgMap.get(r.code)||0), group:(itemsMap.get(r.code)||{}).group || '', barcode:(itemsMap.get(r.code)||{}).barcode || ''}));
}
const transferPrioWeight = {red:0, orange:1, yellow:2};
const collAr = new Intl.Collator('ar');
const collNum = new Intl.Collator('en', {numeric:true});
// Order of the transfer rows (screen, saved operation and its print all use it):
//   destination branch (sequential) — everything going to one branch stays together
//   → inside each branch the groups run A→Z (items with no group last), and the group order starts over
//     again from the beginning for the next branch
//   → source branch → priority → item code
function transferSortCompare(a,b){
  const toC = collNum.compare(String(a.to), String(b.to));
  if(toC) return toC;
  const ga = a.group||'', gb = b.group||'';
  if(ga!==gb){
    if(!ga) return 1;
    if(!gb) return -1;
    return collAr.compare(ga, gb) || (ga<gb ? -1 : 1);
  }
  return collNum.compare(String(a.from), String(b.from))
      || (transferPrioWeight[a.priority]-transferPrioWeight[b.priority])
      || collNum.compare(String(a.code), String(b.code));
}
function filteredTransferRows(){
  let rows = allTransferRowsWithGroup();
  const st = ps('transfer');
  rows = applySearch(rows, ['code','name','from','to','fromName','toName','group'], st.q);
  if(st.priority) rows = rows.filter(r=>r.priority===st.priority);
  if(st.from) rows = rows.filter(r=>r.from===st.from);
  if(st.to) rows = rows.filter(r=>r.to===st.to);
  if(st.groups && st.groups.length) rows = rows.filter(r=>st.groups.includes(r.group));
  if(st.movements && st.movements.length) rows = rows.filter(r=>st.movements.includes(r.movement));
  rows.sort(transferSortCompare);
  return rows;
}
function selectAllFilteredTransfers(){
  const rows = filteredTransferRows();
  rows.forEach(r=> transferSelected.add(r.code+'|'+r.from+'|'+r.to));
  render();
}
async function executeTransfer(){
  if(transferSelected.size===0){ alert('حدد صنفًا واحدًا على الأقل قبل تنفيذ التحويل.'); return; }
  const rows = allTransferRowsWithGroup();
  let toExecute = rows.filter(r=> transferSelected.has(r.code+'|'+r.from+'|'+r.to));
  if(toExecute.length===0){ alert('العناصر المحددة لم تعد ضمن مقترحات التدوير الحالية (ربما تغيّرت البيانات) — أعد التحديد.'); transferSelected.clear(); render(); return; }
  // Keep the exact same order the items were shown/selected in (grouped by destination branch).
  toExecute = toExecute.slice().sort(transferSortCompare);
  const fromCodes = Array.from(new Set(toExecute.map(r=>r.from)));
  const batch = {
    id: 't'+Date.now(),
    seq: Math.max(0, ...DB.transfers.map(batchSeq)) + 1,
    fromCodes,
    executedAt: new Date().toISOString(),
    items: toExecute.map(r=>({itemCode:r.code, itemName:r.name, barcode:r.barcode, group:r.group, from:r.from, fromName:r.fromName,
      to:r.to, toName:r.toName, qty:r.qty, fromStock:r.fromStock, toStock:r.toStock, priority:r.priority, priorityLabel:r.priorityLabel}))
  };
  DB.transfers.push(batch);
  const ok = await saveDB('transfers');
  transferSelected.clear();
  render();
  alert(ok? ('تم تنفيذ التحويل وحفظه كعملية مستقلة رقم #' + batch.seq + ' (' + batch.items.length + ' صنف) ✅') : 'تعذر الحفظ محليًا ⚠️');
}
function batchFromLabel(b){
  if(!b.items.length) return '—';
  const seen = [];
  for(const it of b.items){ if(!seen.some(s=>s.code===it.from)) seen.push({code:it.from, name:it.fromName}); }
  if(seen.length===1) return seen[0].code + (seen[0].name? ' — '+seen[0].name : '');
  return seen.map(s=>s.code).join('، ') + ' (عدة فروع)';
}
function batchRows(b){

    'من فرع':r.from,'اسم الفرع (من)':r.fromName,'مخزون الفرع المحوَّل منه':r.fromStock,

function batchSeq(b){ return b.seq || (DB.transfers.indexOf(b) + 1); }
async function deleteTransferBatch(id, skipConfirm){
  const b = DB.transfers.find(x=>x.id===id);
  if(!b){ alert('العملية غير موجودة.'); return; }
  const msg = 'حذف عملية التحويل رقم #'+batchSeq(b)+' (من فرع '+batchFromLabel(b)+' — '+b.items.length+' صنف)؟\n\n'
    + 'لا يمكن التراجع عن الحذف. الحذف يزيل سجل العملية فقط ولا يغيّر أرقام المخزون في النظام.';
  if(!skipConfirm && !(await uiConfirm(msg, {danger:true, okText:'حذف العملية'}))) return;
  // Freeze the numbers of older records that were numbered only by position, so deleting one
  // never renumbers the operations that remain.
  DB.transfers.forEach((x,i)=>{ if(!x.seq) x.seq = i + 1; });
  const backup = DB.transfers;
  DB.transfers = backup.filter(x=>x.id!==id);
  const ok = await saveDB('transfers');
  if(!ok){ DB.transfers = backup; alert('تعذر حفظ الحذف في هذا المتصفح — لم تُحذف العملية.'); }
  render();
}

// Warning column (screen only — never exported/printed): has this item already been transferred to the same destination branch
// in a saved executed operation? `excludeId`/`beforeTs` let the edit page look only at OTHER, earlier operations.
function transferPrevMap(excludeId, beforeTs){
  const m = new Map();
  for(const b of DB.transfers){
    if(excludeId && b.id===excludeId) continue;
    if(beforeTs && !((b.executedAt||'') < beforeTs)) continue;
    for(const it of b.items){ const k = it.itemCode+'|'+it.to; if(!m.has(k)) m.set(k, []); m.get(k).push({seq:batchSeq(b), qty:Number(it.qty)||0, at:b.executedAt||''}); }
  }
  return m;
}
function transferPrevCell(list){
  if(!list || !list.length) return '<span style="color:var(--muted)">—</span>';
  const sorted = list.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))), last = sorted[0];
  const total = list.reduce((a,x)=>a+x.qty,0);
  const tip = sorted.map(x=>'عملية #'+x.seq+' — '+x.qty.toLocaleString()+' حبة — '+String(x.at).slice(0,10)).join('\n');
  return `<span class="badge orange" data-tip="${escAttr('سبق تحويل هذا الصنف إلى نفس الفرع:\n'+tip)}">⚠️ سبق تحويله ${list.length>1?list.length+' مرات':''} — ${total.toLocaleString()} حبة · آخر عملية #${last.seq} (${String(last.at).slice(0,10)})</span>`;
}

// ---- Editing an executed operation: change an item's transferred quantity, or remove an item ----
// Works on a draft copy; nothing is written to the operation until "حفظ التعديلات".
function startTransferEdit(id){
  const b = DB.transfers.find(x=>x.id===id);
  if(!b){ alert('العملية غير موجودة.'); return; }
  editingBatchId = id;
  editDraft = b.items.map(it=>({...it, _start: it.qty, _base: it.origQty!=null ? it.origQty : it.qty}));
  const st = ps('transferedit'); st.q = ''; st.page = 1;
  render();
}
function cancelTransferEdit(){ editingBatchId = null; editDraft = null; render(); }
function editDraftQty(i, v){
  const n = Number(v);
  if(String(v).trim()==='' || !Number.isInteger(n) || n<=0){ alert('أدخل كمية صحيحة (عدد صحيح أكبر من صفر).'); render(); return; }
  const it = editDraft[i]; if(!it) return;
  it.qty = n;
  // update in place (no re-render) so tabbing between quantity fields keeps working
  const note = document.getElementById('edo-'+i);
  if(note) note.textContent = it._base!==n ? '(الأصلية: '+it._base+')' : '';
  const tot = document.getElementById('edit-total');
  if(tot) tot.textContent = editDraft.reduce((a,x)=>a+x.qty,0).toLocaleString();
}
function removeDraftItem(i){ editDraft.splice(i,1); render(); }
async function saveTransferEdit(){
  const b = DB.transfers.find(x=>x.id===editingBatchId);
  if(!b || !editDraft){ cancelTransferEdit(); return; }
  if(editDraft.length===0){
    if(!(await uiConfirm('حذفت كل أصناف العملية رقم #'+batchSeq(b)+'. هل تريد حذف العملية بالكامل؟', {danger:true, okText:'حذف العملية بالكامل'}))) return;
    editingBatchId = null; editDraft = null;
    await deleteTransferBatch(b.id, true);
    return;
  }
  const removed = b.items.length - editDraft.length;
  const changed = removed>0 || editDraft.some(x=>x.qty!==x._start);
  if(!changed){ cancelTransferEdit(); alert('لا توجد تعديلات لحفظها.'); return; }
  const snapshot = {items:b.items, fromCodes:b.fromCodes, editedAt:b.editedAt};
  b.items = editDraft.map(x=>{
    const {_base, _start, ...rest} = x;
    if(_base!==rest.qty) rest.origQty = _base; else delete rest.origQty;   // remember the quantity it was first executed with
    return rest;
  });
  b.fromCodes = Array.from(new Set(b.items.map(r=>r.from)));
  b.editedAt = new Date().toISOString();
  const ok = await saveDB('transfers');
  if(!ok){ Object.assign(b, snapshot); alert('تعذر حفظ التعديلات في هذا المتصفح — لم يتغير شيء في العملية.'); return; }
  editingBatchId = null; editDraft = null;
  render();
  alert('تم حفظ التعديلات على العملية رقم #'+batchSeq(b)+' ✅');
}

  const b = DB.transfers.find(x=>x.id===editingBatchId);

  const trs = info.rows.map(r=>`<tr><td>${r.itemCode}</td><td>${r.barcode||'—'}</td><td>${r.itemName}</td><td>${r.group||'—'}</td>

  const body = editDraft.length===0
    ? `<div class="empty">حذفت كل أصناف هذه العملية — عند الضغط على "حفظ التعديلات" سيُطلب منك حذف العملية بالكامل، أو اضغط "إلغاء" للتراجع.</div>`

  <tbody>${trs}</tbody></table></div>`);
  return `

  <div class="toolbar">${searchBox('transferedit','q-tedit','ابحث عن صنف في هذه العملية...')}
    <button class="btn" onclick="saveTransferEdit()">💾 حفظ التعديلات</button>
    <button class="btn ghost" onclick="cancelTransferEdit()">إلغاء</button></div>
  <p style="font-size:12.5px;margin-bottom:10px">عدد الأصناف: <b>${editDraft.length.toLocaleString()}</b> — إجمالي الكمية المحولة: <b id="edit-total">${totalQty.toLocaleString()}</b>${removed>0? ` — أصناف محذوفة (لم تُحفظ بعد): <b>${removed}</b>` : ''}</p>
  ${body}`;

// ---------- حركة المخزون (+ صفحة تحليل الأصناف المستوردة): item-level view = branch stock + central stock + sales ----------
// Both pages share this engine; `key` is the page-state key: 'invmove' (all items) or 'invlist' (only the imported items).
var scOpen = '';                                    // which multi-select dropdown is open ('' = none); shared by every page that has them
document.addEventListener('click', e=>{ if(scOpen && !(e.target.closest && e.target.closest('.dropdown-wrap'))){ scOpen=''; render(); } });
function imSt(key){ const st = ps(key); for(const f of ['months','branches','items','cols']) if(!st[f]) st[f] = []; return st; }
const IM_COLS = [{v:'avg',l:'متوسط البيع الشهري (كل الفروع)'},{v:'price',l:'سعر البيع'},{v:'cost',l:'سعر الشراء (التكلفة)'},{v:'costvat',l:'سعر الشراء شامل الضريبة'}];
function imJs(v){ return escAttr(v).replace(/'/g,'&#39;').replace(/\\/g,'\\\\'); }
function imToggle(key, field, val, on){ const st = imSt(key), a = st[field], i = a.indexOf(val); if(on && i<0) a.push(val); if(!on && i>=0) a.splice(i,1); st.page = 1; render(); }
function imClear(key, field){ const st = imSt(key); st[field] = []; st.page = 1; render(); }
function imSelAll(key, field){ const st = imSt(key); st[field] = field==='months' ? monthlySalesMonths().slice() : field==='cols' ? IM_COLS.map(c=>c.v) : DB.branches.map(b=>b.code); st.page = 1; render(); }
function imDD(id){ scOpen = scOpen===id ? '' : id; render(); }
function imMulti(key, field, label, opts, emptyLabel){
  const st = imSt(key), sel = st[field], id = key+':'+field;
  const txt = sel.length ? label+' ('+sel.length+')' : emptyLabel;
  const panel = scOpen===id ? `<div class="dropdown-panel"><button type="button" class="dd-clear" onclick="imSelAll('${key}','${field}')">تحديد الكل</button><button type="button" class="dd-clear" onclick="imClear('${key}','${field}')">مسح التحديد</button>${opts.map(o=>`<label><input type="checkbox" ${sel.includes(o.v)?'checked':''} onchange="imToggle('${key}','${field}','${imJs(o.v)}', this.checked)"> ${o.l}</label>`).join('')}</div>` : '';
  return `<div class="dropdown-wrap"><button type="button" class="dropdown-toggle" onclick="imDD('${id}')">${txt} ▾</button>${panel}</div>`;
}
function imItemQ(key, val){ imSt(key).itemQ = val; render(); }
function imItemPicker(key, cands){
  const st = imSt(key), id = key+':items', sel = st.items;
  const txt = sel.length ? 'الأصناف ('+sel.length+')' : 'كل الأصناف';
  let panel = '';
  if(scOpen===id){
    const q = (st.itemQ||'').trim().toLowerCase();
    let list = q ? cands.filter(i=>String(i.code).toLowerCase().includes(q) || String(i.barcode||'').toLowerCase().includes(q) || String(i.name||'').toLowerCase().includes(q)) : cands;
    const total = list.length; list = list.slice(0,40);
    panel = `<div class="dropdown-panel" style="min-width:320px"><input id="im-iq-${key}" type="text" placeholder="ابحث بالرقم أو الباركود أو الاسم" value="${escAttr(st.itemQ||'')}" oninput="imItemQ('${key}',this.value)" style="width:100%;margin-bottom:4px">
      <button type="button" class="dd-clear" onclick="imClear('${key}','items')">مسح التحديد (${sel.length})</button>
      ${list.map(i=>`<label><input type="checkbox" ${sel.includes(i.code)?'checked':''} onchange="imToggle('${key}','items','${imJs(i.code)}', this.checked)"> ${i.code} — ${i.name||''}</label>`).join('')}
      ${total>40?`<div style="font-size:11px;color:var(--muted);padding:4px 6px">يظهر أول 40 من ${total.toLocaleString()} — ضيّق البحث</div>`:''}${!total?'<div style="font-size:11px;color:var(--muted);padding:4px 6px">لا نتائج</div>':''}</div>`;
  }
  return `<div class="dropdown-wrap"><button type="button" class="dropdown-toggle" onclick="imDD('${id}')">${txt} ▾</button>${panel}</div>`;
}
// imported list → item codes (an entry may be an item number or a barcode)
function imResolveList(){
  const byCode = new Map(DB.items.map(i=>[String(i.code), i.code])), byBar = new Map();
  for(const i of DB.items) if(i.barcode) byBar.set(String(i.barcode), i.code);
  let known = null;
  const codes = new Set(), unmatched = [];
  for(const e of DB.invList){
    const v = String(e.v).trim();
    if(byCode.has(v)) codes.add(byCode.get(v));
    else if(byBar.has(v)) codes.add(byBar.get(v));
    else{
      if(!known){ known = new Set(); for(const r of DB.branch) known.add(r.itemCode); for(const r of DB.central) known.add(r.itemCode); for(const r of DB.monthlySales) known.add(r.itemCode); }
      if(known.has(v)) codes.add(v); else unmatched.push(v);
    }
  }
  return {codes, unmatched};
}
function imBranchCols(key){
  const st = imSt(key), all = DB.branches.map(b=>b.code);
  return st.branches.length ? all.filter(c=>st.branches.includes(c)).concat(st.branches.filter(c=>!all.includes(c))) : all;
}
function invMoveRows(key){
  key = key || 'invmove';
  const st = imSt(key);
  const monthSet = st.months.length ? new Set(st.months) : null;
  const brSet = st.branches.length ? new Set(st.branches) : null;
  const only = key==='invlist' ? imResolveList().codes : null;
  const per = new Map();                               // item -> {branch: latest stock}
  for(const r of latestBranchInv()){
    if(brSet && !brSet.has(r.branch)) continue;
    if(only && !only.has(r.itemCode)) continue;
    let m = per.get(r.itemCode); if(!m){ m = {}; per.set(r.itemCode, m); }
    m[r.branch] = (m[r.branch]||0) + (Number(r.qty)||0);
  }
  const cen = centralStockByItem();
  const avgMap = st.cols.includes('avg') ? itemAvgMonthlyMap() : null;
  const sold = new Map();
  if(monthSet) for(const r of DB.monthlySales){
    if(!monthSet.has(r.month)) continue;
    if(brSet && !brSet.has(r.branch)) continue;
    if(only && !only.has(r.itemCode)) continue;
    sold.set(r.itemCode, (sold.get(r.itemCode)||0) + (Number(r.qty)||0));
  }
  const seen = new Set(), rows = [];
  const mk = (code, it)=>{
    const m = per.get(code) || {}, b = Object.values(m).reduce((a,x)=>a+x,0), c = cen.get(code)||0;
    return {code, barcode:it.barcode||'', name:it.name||'', group:it.group||'', supplier:it.supplier||'',
      branchQty:b, per:m, centralQty:c, total:b+c, sales: monthSet ? (sold.get(code)||0) : null,
      avg: avgMap ? Math.round((avgMap.get(code)||0)*10)/10 : null, price: Number(it.price)||0, cost: Number(it.cost)||0, costVat: Number(it.costVat)||0};
  };
  for(const it of DB.items){ if(only && !only.has(it.code)) continue; seen.add(it.code); rows.push(mk(it.code, it)); }
  // codes that have stock/sales but are missing from the items file
  for(const code of new Set([...per.keys(), ...(only ? [] : cen.keys()), ...sold.keys(), ...(only ? [...only] : [])])) if(!seen.has(code)){ seen.add(code); rows.push(mk(code, {})); }
  return rows;
}
function invMoveFiltered(key){
  key = key || 'invmove';
  const st = imSt(key);
  let rows = applySearch(invMoveRows(key), ['code','barcode','name','group','supplier'], st.q);
  if(st.items.length){ const s = new Set(st.items); rows = rows.filter(r=>s.has(r.code)); }
  if(st.group) rows = rows.filter(r=>r.group===st.group);
  if(st.supplier) rows = rows.filter(r=>r.supplier===st.supplier);
  if(st.stock==='has') rows = rows.filter(r=>r.total>0);
  if(st.stock==='none') rows = rows.filter(r=>r.total<=0);
  if(st.months.length && st.salesOnly) rows = rows.filter(r=>r.sales>0);
  return rows;
}
function invMoveMonthLabel(key){
  const st = imSt(key||'invmove'), all = monthlySalesMonths();
  if(!st.months.length) return '';
  const m = st.months.slice().sort();
  if(m.length===all.length) return 'كل الشهور';
  return m.length<=2 ? m.join('، ') : m.length+' أشهر';
}
function imBranchLabel(c){ const n = branchNameMap().get(c); return n ? c+' — '+n : c; }
function invMoveSheet(rows, key){
  key = key || 'invmove';
  const st = imSt(key), bcols = imBranchCols(key), split = !!st.split;
  return rows.map(r=>{
    const o = {'رقم الصنف':r.code,'الباركود':r.barcode,'اسم الصنف':r.name,'المجموعة':r.group,'المورد':r.supplier};
    if(st.cols.includes('avg')) o['متوسط البيع الشهري (كل الفروع)'] = r.avg;
    if(st.cols.includes('price')) o['سعر البيع'] = r.price;
    if(st.cols.includes('cost')) o['سعر الشراء (التكلفة)'] = r.cost;
    if(st.cols.includes('costvat')) o['سعر الشراء شامل الضريبة'] = r.costVat;
    if(split) for(const c of bcols) o['مخزون '+imBranchLabel(c)] = r.per[c]||0;
    else o[st.branches.length ? 'مخزون الفروع المحددة' : 'مخزون الفروع'] = r.branchQty;
    o['مخزون المخازن الرئيسية'] = r.centralQty; o['إجمالي المخزون'] = r.total;
    if(st.months.length) o['المبيعات ('+invMoveMonthLabel(key)+')'] = r.sales;
    return o;
  });
}
function imNote(key){
  const st = imSt(key), out = [];
  if(st.branches.length) out.push(['الفروع', st.branches.map(imBranchLabel).join('، ')]);
  if(st.months.length) out.push(['أشهر المبيعات', st.months.slice().sort().join('، ')]);
  if(st.group) out.push(['المجموعة', st.group]);
  if(st.supplier) out.push(['المورد', st.supplier]);
  if(st.items.length) out.push(['أصناف محددة', st.items.length.toLocaleString()]);
  return out;
}
async function imExport(type, key){
  const rows = invMoveSheet(invMoveFiltered(key), key), title = key==='invlist' ? 'تحليل_الأصناف_المستوردة' : 'حركة_المخزون';
  if(type==='xlsx') await exportRowsExcel(rows, title);
  else await exportRowsPDF(rows, title, {opName: key==='invlist' ? 'تحليل حركة مخزون الأصناف المستوردة' : 'تقرير حركة المخزون', extra: imNote(key), noDev:true});
}
function imImport(file){
  if(!file) return;
  readSheetRowsWithHeader(file, async (header, rest)=>{
    const h0 = header.map(x=>String(x==null?'':x).trim());
    const isHeader = h0.some(h=>/رقم|كود|باركود|صنف|code|item|barcode/i.test(h));
    let idx = h0.findIndex(h=>/رقم الصنف|كود الصنف|باركود|barcode|code|item/i.test(h)); if(idx<0) idx = 0;
    const rows = isHeader ? rest : [header].concat(rest);
    const seen = new Set(), vals = [];
    for(const r of rows){
      const v = r[idx]; if(v==null || v==='') continue;
      const c = String(v).trim();
      if(c && !seen.has(c)){ seen.add(c); vals.push(c); }
    }
    if(!vals.length){ uiAlert('لم يتم العثور على أي رقم صنف أو باركود في الملف. ضعها في العمود الأول (أو في عمود عنوانه "رقم الصنف" أو "الباركود").'); return; }
    if(DB.invList.length && !(await uiConfirm('توجد قائمة أصناف محفوظة ('+DB.invList.length.toLocaleString()+'). سيتم استبدالها بقائمة الملف ('+vals.length.toLocaleString()+'). متابعة؟', {okText:'استبدال القائمة'}))) return;
    DB.invList = vals.map(v=>({v}));
    const ok = await saveDB('invList');
    ps('invmove').view = 'list'; ps('invlist').page = 1; scOpen = '';
    render();
    const un = imResolveList().unmatched;
    let msg = 'تم استيراد '+vals.length.toLocaleString()+' صنف'+(ok?' وحفظها في هذا المتصفح.':' لكن فشل الحفظ في المتصفح.');
    if(un.length) msg += '\n\n'+un.length.toLocaleString()+' رقم/باركود غير موجود في بيانات النظام: '+un.slice(0,8).join('، ')+(un.length>8?' ...':'');
    uiAlert(msg);
  });
}

const SC_COLORS = ['#C8A45C','#2563EB','#0D9488','#DB2777','#7C3AED','#EA580C','#65A30D','#0891B2','#B45309','#475569'];
function scSt(){
  const st = ps('supcmp');
  if(!st.months) Object.assign(st, {months:[], others:[], groups:[], main:'', metric:'qty', chart:false});
  if(!st.branches) st.branches = []; if(!st.items) st.items = [];
  return st;
}
function scSetView(v){ ps('invmove').view = v; scOpen=''; render(); }
function scToggle(key, val, on){ const st = scSt(), a = st[key], i = a.indexOf(val); if(on && i<0) a.push(val); if(!on && i>=0) a.splice(i,1); render(); }
function scClear(key){ scSt()[key] = []; render(); }
function scDD(key){ scOpen = scOpen===key ? '' : key; render(); }
function scSet(field, val){ const st = scSt(); st[field] = val; if(field==='main') st.others = st.others.filter(o=>o!==val); render(); }
function scMulti(key, label, opts, emptyLabel){
  const st = scSt(), sel = st[key];
  const txt = sel.length ? label+' ('+sel.length+')' : emptyLabel;
  return `<div class="dropdown-wrap"><button type="button" class="dropdown-toggle" onclick="scDD('${key}')">${txt} ▾</button>${scOpen===key ? `<div class="dropdown-panel"><button type="button" class="dd-clear" onclick="scClear('${key}')">مسح التحديد</button>${opts.map(o=>`<label><input type="checkbox" ${sel.includes(o)?'checked':''} onchange="scToggle('${key}','${escAttr(o).replace(/'/g,'&#39;')}', this.checked)"> ${o}</label>`).join('')}</div>` : ''}</div>`;
}
function scCompute(){
  const st = scSt();
  const sups = st.main ? [st.main, ...st.others.filter(o=>o!==st.main)] : [];
  const months = new Set(st.months.length ? st.months : monthlySalesMonths());
  const brSet = st.branches.length ? new Set(st.branches) : null, itSet = st.items.length ? new Set(st.items) : null;
  const supSet = new Set(sups), grpSet = st.groups.length ? new Set(st.groups) : null;
  const itemMap = new Map(DB.items.map(i=>[i.code,i]));
  const NOG = 'بدون مجموعة';
  const data = new Map();                           // group -> Map(supplier -> value)
  for(const r of DB.monthlySales){
    if(!months.has(r.month)) continue;
    if(brSet && !brSet.has(r.branch)) continue;
    if(itSet && !itSet.has(r.itemCode)) continue;
    const it = itemMap.get(r.itemCode); if(!it || !supSet.has(it.supplier)) continue;
    const g = it.group || NOG; if(grpSet && !grpSet.has(g) && !(g===NOG && grpSet.has(NOG))) continue;
    const v = (Number(r.qty)||0) * (st.metric==='value' ? (Number(it.price)||0) : 1);
    let m = data.get(g); if(!m){ m = new Map(); data.set(g,m); }
    m.set(it.supplier, (m.get(it.supplier)||0) + v);
  }
  const rows = Array.from(data.entries()).map(([g,m])=>{
    const vals = sups.map(s=>m.get(s)||0), total = vals.reduce((a,b)=>a+b,0);
    return {group:g, vals, total, share: total? vals[0]/total*100 : 0};
  }).sort((a,b)=>b.vals[0]-a.vals[0] || b.total-a.total);
  const totals = sups.map((_,i)=>rows.reduce((a,r)=>a+r.vals[i],0)), grand = totals.reduce((a,b)=>a+b,0);
  return {sups, rows, totals, grand, mainShare: grand? totals[0]/grand*100 : 0, monthsUsed:[...months].sort()};
}
function scRound(v){ return Math.round(v*100)/100; }
function scSheet(c){
  const st = scSt(), unit = st.metric==='value' ? 'قيمة البيع' : 'الكمية';
  const out = c.rows.map(r=>{
    const o = {'المجموعة':r.group};
    c.sups.forEach((s,i)=>{ o[s+(i===0?' (الرئيسي)':'')+' — '+unit] = scRound(r.vals[i]); });
    o['إجمالي المقارنة'] = scRound(r.total);
    c.sups.forEach((s,i)=>{ o['حصة '+s+' %'] = r.total ? Math.round(r.vals[i]/r.total*1000)/10 : 0; });
    return o;
  });
  if(out.length){
    const o = {'المجموعة':'الإجمالي'};
    c.sups.forEach((s,i)=>{ o[s+(i===0?' (الرئيسي)':'')+' — '+unit] = scRound(c.totals[i]); });
    o['إجمالي المقارنة'] = scRound(c.grand);
    c.sups.forEach((s,i)=>{ o['حصة '+s+' %'] = c.grand ? Math.round(c.totals[i]/c.grand*1000)/10 : 0; });
    out.push(o);
  }
  return out;
}

// ================= USERS & PERMISSIONS =================
// The owner account (the one created on first use, kept in localStorage 'inv_auth') is always a full administrator.
// Extra users live in the 'users' store. Each page has three permissions: v = view the page, e = edit / import / execute / delete on it,
// x = export (Excel / PDF / PNG / copy). NOTE: this system runs entirely in the browser, so these rules control what the interface
// lets a user do — they are not a server-side security boundary.
let curUser = null;                                  // {id, name, username, admin, perms}
function can(tab, a){
  if(!curUser || curUser.admin) return true;
  const p = curUser.perms && curUser.perms[tab];
  return !!(p && p[a]);
}
function permWord(a){ return a==='v' ? 'عرض هذه الصفحة' : a==='e' ? 'التعديل أو الاستيراد أو التنفيذ في هذه الصفحة' : 'التصدير والتنزيل من هذه الصفحة'; }
function permDeny(a){ uiAlert('ليس لديك صلاحية '+permWord(a)+'. تواصل مع مدير النظام.'); }
const STORE_OWNER_TABS = {items:['import'],suppliers:['import'],branches:['import'],branch:['import'],sales:['import'],expiry:['import'],central:['import'],monthlySales:['import'],purchases:['import'],
  transfers:['transfer'],expRot:['expiry'],promoItems:['promo'],stopped:['dead','autoorder'],autoThresholds:['autoorder'],invList:['invmove'],limParams:[]};
function canSaveStore(k){
  if(!curUser || curUser.admin) return true;
  if(k==='users') return false;
  const tabs = STORE_OWNER_TABS[k] || [];
  return tabs.some(t=>can(t,'e'));
}
function permGuard(name, a, tab){        // wraps a global function so it only runs when the current user holds the permission
  const orig = window[name]; if(typeof orig!=='function') return;
  window[name] = function(...args){
    const ok = a==='admin' ? (!curUser || curUser.admin) : can(tab || activeTab, a);
    if(!ok){ if(a==='admin') uiAlert('هذا الإجراء لمدير النظام فقط.'); else permDeny(a); return; }
    return orig.apply(this, args);
  };
}
function installPermGuards(){
  if(installPermGuards._done) return; installPermGuards._done = true;
  const edit = {import:['importItems','importBranches','importSuppliers','importBranch','importSales','importExpiry','importCentral','importMonthlySales','importPurchases'],
    transfer:['executeTransfer','saveTransferEdit','deleteTransferBatch','startTransferEdit'], expiry:['expExecute','expOpDelete'], promo:['importPromoItems','clearPromoItems'],
    invmove:['imImport','imClearList'], autoorder:['setAutoThreshold','resetAutoThresholds']};
  for(const [tab,fns] of Object.entries(edit)) fns.forEach(n=>permGuard(n,'e',tab));
  ['importStopped'].forEach(n=>permGuard(n,'e'));
  ['resetAll','restoreFromFile'].forEach(n=>permGuard(n,'admin'));
  ['exportRowsExcel','exportRowsPDF','mgPng','mgXlsx','mgXlsxAll','mgCopy','downloadBackup'].forEach(n=>permGuard(n,'x', n==='downloadBackup' ? 'import' : null));
}
function firstViewableTab(){ const t = TABS.find(t=>t.id!=='users' && can(t.id,'v')); return t ? t.id : null; }
function visibleTabs(){ return TABS.filter(t=> t.id==='users' ? !!(curUser && curUser.admin) : can(t.id,'v')); }

async function pwHash(salt, pass){
  const s = salt+':'+pass;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return 'h1:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619)>>>0; }
  return 'h0:'+h.toString(16);
}
function newSalt(){ return Array.from(crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(12)) : Array.from({length:12},()=>Math.floor(Math.random()*256))).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function ownerName(){ try{ return JSON.parse(localStorage.getItem('inv_auth')||'{}').u || ''; }catch(e){ return ''; } }
function resolveCurrentUser(){
  const id = sessionStorage.getItem('inv_user');
  if(!id || id==='owner'){ curUser = {id:'owner', name:ownerName()||'المالك', username:ownerName(), admin:true, perms:{}}; return true; }
  const u = (DB.users||[]).find(x=>x.id===id && x.active!==false);
  if(!u){ curUser = null; return false; }
  curUser = {id:u.id, name:u.name||u.username, username:u.username, admin:false, perms:u.perms||{}};
  return true;
}

function usrStart(id){ const u = DB.users.find(x=>x.id===id); if(!u) return; usrEdit = {id, name:u.name||'', username:u.username, password:'', active:u.active!==false, perms:JSON.parse(JSON.stringify(u.perms||{}))}; render(); }
function usrCancel(){ usrEdit = null; render(); }

function usrPerm(tab, a, on){
  const p = usrEdit.perms[tab] || (usrEdit.perms[tab] = {});
